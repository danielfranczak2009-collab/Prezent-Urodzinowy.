<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nasza Gra</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }


        /* =========================
           GRA
        ========================= */

        #game {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
        }


        /* =========================
           MAPA
        ========================= */

        #game-map {
            position: absolute;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            object-fit: fill;

            display: block;
        }


        /* =========================
           NIEWIDZIALNE HOTSPOTY
        ========================= */

        .location {

            position: absolute;

            width: 80px;
            height: 80px;

            transform: translate(-50%, -50%);

            border: none;

            padding: 0;
            margin: 0;

            background: transparent;

            cursor: pointer;

            z-index: 5;

            border-radius: 50%;

            outline: none;

            appearance: none;
        }


        /* =========================
           POZYCJE LOKACJI
        ========================= */

        #forest {
            left: 35.45%;
            top: 45.08%;
        }


        #lake {
            left: 54.85%;
            top: 44.54%;
        }


        /* =========================
           CASTLE
           
           Punkty:
           965,501
           1035,499
           1039,412
           960,420

           Przy rozdzielczości mapy:
           1320 × 925
        ========================= */

        #castle {

            left: 72.727%;
            top: 44.541%;

            width: 5.985%;
            height: 9.622%;

            transform: translate(0, 0);

            border-radius: 0;

            clip-path: polygon(
                0% 9.091%,
                93.151% 0%,
                100% 98.966%,
                6.757% 100%
            );
        }


        #cave {
            left: 86.82%;
            top: 22.81%;
        }


        /* =========================
           EKRAN ZAGADKI
        ========================= */

        #puzzle-screen {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.85);

            z-index: 100;
        }


        /* =========================
           PUDEŁKO ZAGADKI
        ========================= */

        #puzzle-box {

            width: min(600px, 90vw);

            padding: 40px;

            border-radius: 24px;

            background: #171717;

            color: white;

            text-align: center;

            box-shadow:
                0 0 40px rgba(0, 0, 0, 0.8);
        }


        #puzzle-box h1 {

            margin-top: 0;

            font-size: 36px;
        }


        #puzzle-box p {

            font-size: 18px;

            line-height: 1.6;
        }


        /* =========================
           ODPOWIEDŹ
        ========================= */

        #answer {

            width: 200px;

            padding: 12px;

            margin-top: 10px;

            border: none;

            border-radius: 8px;

            font-size: 18px;

            text-align: center;
        }


        /* =========================
           PRZYCISKI
        ========================= */

        .puzzle-button {

            margin: 15px 5px 0;

            padding: 12px 22px;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            cursor: pointer;
        }


        /* =========================
           PODPOWIEDŹ
        ========================= */

        #hint-button {

            background: #252525;

            color: white;

            display: inline-block;
        }


        #hint-box {

            display: none;

            margin-top: 20px;

            padding: 18px;

            border-radius: 14px;

            background: #222;

            font-size: 17px;

            line-height: 1.6;
        }


        #hint-question {

            display: none;

            margin-top: 18px;

            font-size: 17px;

            line-height: 1.5;
        }


        #hint-yes,
        #hint-no {

            display: none;

            margin: 8px 4px 0;

            padding: 9px 18px;

            border: none;

            border-radius: 9px;

            cursor: pointer;

            font-size: 15px;
        }


        /* =========================
           WIADOMOŚĆ
        ========================= */

        #message {

            min-height: 28px;

            margin-top: 18px;

            font-size: 18px;
        }

    </style>

</head>


<body>


    <div id="game">


        <!-- =========================
             MAPA
        ========================= -->

        <img
            id="game-map"
            src="Storybook-World-Map.png"
            alt="Mapa gry"
        >


        <!-- =========================
             FOREST
        ========================= -->

        <button
            id="forest"
            class="location"
            onclick="openForest()"
            aria-label="Forest"
        ></button>


        <!-- =========================
             LAKE + BRIDGE
        ========================= -->

        <button
            id="lake"
            class="location"
            onclick="openLocation('Lake + Bridge')"
            aria-label="Lake + Bridge"
        ></button>


        <!-- =========================
             CASTLE
        ========================= -->

        <button
            id="castle"
            class="location"
            onclick="openLocation('Castle')"
            aria-label="Castle"
        ></button>


        <!-- =========================
             CAVE
        ========================= -->

        <button
            id="cave"
            class="location"
            onclick="openLocation('Cave')"
            aria-label="Cave"
        ></button>


    </div>



    <!-- =========================
         EKRAN ZAGADKI
    ========================= -->

    <div id="puzzle-screen">


        <div id="puzzle-box">


            <h1 id="puzzle-title">
                🌲 Las
            </h1>


            <p id="puzzle-description">
                W lesie znajdujesz dziwną tabliczkę.
            </p>


            <p id="puzzle-question">

                <strong>
                    46 368 &nbsp;&nbsp; 10 946 &nbsp;&nbsp; 121 393
                    &nbsp;&nbsp; 28 657 &nbsp;&nbsp; 75 025
                    &nbsp;&nbsp; 17 711
                </strong>

            </p>


            <p id="puzzle-instruction">
                Jaka liczba powinna pojawić się jako następna?
            </p>


            <input
                id="answer"
                type="text"
                placeholder="Wpisz liczbę"
            >


            <br>


            <button
                id="check-button"
                class="puzzle-button"
                onclick="checkAnswer()"
            >
                Sprawdź
            </button>


            <button
                id="hint-button"
                class="puzzle-button"
                onclick="showHint()"
            >
                💭 „Coś mi to przypomina…”
            </button>


            <button
                class="puzzle-button"
                onclick="closePuzzle()"
            >
                Wróć
            </button>


            <div id="hint-box"></div>


            <div id="hint-question">
                Chcesz drugą podpowiedź?
                <br>

                <button
                    id="hint-yes"
                    onclick="showSecondHint()"
                >
                    Tak
                </button>

                <button
                    id="hint-no"
                    onclick="hideHintQuestion()"
                >
                    Nie
                </button>
            </div>


            <div id="message"></div>


        </div>

    </div>



    <script>


        /* =========================
           FOREST
        ========================= */

        function openForest() {

            document
                .getElementById("puzzle-title")
                .textContent = "🌲 Las";


            document
                .getElementById("puzzle-description")
                .textContent =
                "W lesie znajdujesz dziwną tabliczkę.";


            document
                .getElementById("puzzle-question")
                .innerHTML =
                "<strong>" +
                "46 368 &nbsp;&nbsp; 10 946 &nbsp;&nbsp; 121 393" +
                "&nbsp;&nbsp; 28 657 &nbsp;&nbsp; 75 025" +
                "&nbsp;&nbsp; 17 711" +
                "</strong>";


            document
                .getElementById("puzzle-instruction")
                .textContent =
                "Jaka liczba powinna pojawić się jako następna?";


            document
                .getElementById("answer")
                .value = "";


            document
                .getElementById("answer")
                .placeholder =
                "Wpisz liczbę";


            document
                .getElementById("answer")
                .style.display =
                "inline-block";


            document
                .getElementById("check-button")
                .style.display =
                "inline-block";


            document
                .getElementById("hint-button")
                .style.display =
                "inline-block";


            document
                .getElementById("hint-box")
                .style.display =
                "none";


            document
                .getElementById("hint-box")
                .textContent = "";


            document
                .getElementById("hint-question")
                .style.display =
                "none";


            document
                .getElementById("hint-yes")
                .style.display =
                "none";


            document
                .getElementById("hint-no")
                .style.display =
                "none";


            document
                .getElementById("message")
                .textContent = "";


            document
                .getElementById("puzzle-screen")
                .style.display =
                "flex";

        }



        /* =========================
           PIERWSZA PODPOWIEDŹ
        ========================= */

        function showHint() {

            const hintBox =
                document.getElementById("hint-box");

            const hintQuestion =
                document.getElementById("hint-question");

            const hintYes =
                document.getElementById("hint-yes");

            const hintNo =
                document.getElementById("hint-no");


            if (hintBox.style.display !== "block") {

                hintBox.textContent =
                    "„Kiedyś powiedziałeś mi, że najlepiej wszystko sobie po kolei ułożyć, zanim ruszysz na głęboką wodę.”";

                hintBox.style.display =
                    "block";

            }

            else {

                hintQuestion.style.display =
                    "block";

                hintYes.style.display =
                    "inline-block";

                hintNo.style.display =
                    "inline-block";

            }

        }



        /* =========================
           DRUGA PODPOWIEDŹ
        ========================= */

        function showSecondHint() {

            document
                .getElementById("hint-question")
                .style.display =
                "none";


            document
                .getElementById("hint-yes")
                .style.display =
                "none";


            document
                .getElementById("hint-no")
                .style.display =
                "none";


            document
                .getElementById("hint-box")
                .textContent =
                "Zacznij od najmniejszej liczby i ułóż wszystkie liczby od najmniejszej do największej.";


            document
                .getElementById("hint-box")
                .style.display =
                "block";

        }



        /* =========================
           UKRYCIE PYTANIA O DRUGĄ
           PODPOWIEDŹ
        ========================= */

        function hideHintQuestion() {

            document
                .getElementById("hint-question")
                .style.display =
                "none";


            document
                .getElementById("hint-yes")
                .style.display =
                "none";


            document
                .getElementById("hint-no")
                .style.display =
                "none";

        }



        /* =========================
           POZOSTAŁE LOKACJE
        ========================= */

        function openLocation(name) {

            document
                .getElementById("puzzle-title")
                .textContent = name;


            document
                .getElementById("puzzle-description")
                .textContent =
                "Ta lokacja jest jeszcze zamknięta.";


            document
                .getElementById("puzzle-question")
                .innerHTML =
                "Wkrótce znajdzie się tutaj zagadka.";


            document
                .getElementById("puzzle-instruction")
                .textContent = "";


            document
                .getElementById("answer")
                .style.display =
                "none";


            document
                .getElementById("check-button")
                .style.display =
                "none";


            document
                .getElementById("hint-button")
                .style.display =
                "none";


            document
                .getElementById("hint-box")
                .style.display =
                "none";


            document
                .getElementById("hint-question")
                .style.display =
                "none";


            document
                .getElementById("hint-yes")
                .style.display =
                "none";


            document
                .getElementById("hint-no")
                .style.display =
                "none";


            document
                .getElementById("message")
                .textContent = "";


            document
                .getElementById("puzzle-screen")
                .style.display =
                "flex";

        }



        /* =========================
           ZAMYKANIE
        ========================= */

        function closePuzzle() {

            document
                .getElementById("puzzle-screen")
                .style.display =
                "none";


            document
                .getElementById("message")
                .textContent = "";


            document
                .getElementById("answer")
                .value = "";


            document
                .getElementById("hint-box")
                .style.display =
                "none";


            document
                .getElementById("hint-question")
                .style.display =
                "none";


            document
                .getElementById("hint-yes")
                .style.display =
                "none";


            document
                .getElementById("hint-no")
                .style.display =
                "none";

        }



        /* =========================
           SPRAWDZANIE ODPOWIEDZI
        ========================= */

        function checkAnswer() {

            const answer =
                document
                    .getElementById("answer")
                    .value
                    .replace(/\s/g, "");


            if (answer === "196418") {

                document
                    .getElementById("message")
                    .textContent =
                    "✓ Poprawnie! Ścieżka prowadzi dalej...";

            }

            else {

                document
                    .getElementById("message")
                    .textContent =
                    "✗ Spróbuj jeszcze raz.";

            }

        }


    </script>


</body>
</html>
