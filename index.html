<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nasza Gra</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }


        /* =========================
           GRA
        ========================= */

        #game {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: black;
        }


        /* =========================
           ŚWIAT
        ========================= */

        #world {
            position: absolute;

            left: -4vw;
            top: -4vh;

            width: 108vw;
            height: 108vh;

            transform: translate3d(0, 0, 0);

            transition: transform 0.15s ease-out;

            will-change: transform;
        }


        /* =========================
           MAPA
        ========================= */

        #game-map {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            object-fit: fill;

            display: block;

            user-select: none;

            pointer-events: none;
        }


        /* =========================
           CYKL DNIA I NOCY
           1 pełny cykl = 60 sekund
        ========================= */

        #day-night {
            position: absolute;

            inset: 0;

            pointer-events: none;

            z-index: 20;

            background: rgba(0, 0, 0, 0);

            animation: dayNightCycle 60s linear infinite;

            mix-blend-mode: multiply;
        }


        @keyframes dayNightCycle {

            0% {
                background: rgba(0, 0, 0, 0);
            }

            25% {
                background: rgba(0, 0, 0, 0);
            }

            50% {
                background: rgba(10, 15, 55, 0.48);
            }

            75% {
                background: rgba(10, 15, 55, 0.20);
            }

            100% {
                background: rgba(0, 0, 0, 0);
            }

        }


        /* =========================
           CHMURY
        ========================= */

        .cloud {

            position: absolute;

            z-index: 10;

            width: 180px;
            height: 55px;

            background: rgba(255, 255, 255, 0.55);

            border-radius: 50px;

            filter: blur(1px);

            opacity: 0.75;

            pointer-events: none;
        }


        .cloud::before,
        .cloud::after {

            content: "";

            position: absolute;

            background: rgba(255, 255, 255, 0.55);

            border-radius: 50%;
        }


        .cloud::before {

            width: 75px;
            height: 75px;

            left: 28px;
            top: -35px;
        }


        .cloud::after {

            width: 95px;
            height: 95px;

            right: 25px;
            top: -48px;
        }


        #cloud1 {

            top: 12%;

            left: -220px;

            transform: scale(0.9);

            animation:
                cloudMove1 75s linear infinite;
        }


        #cloud2 {

            top: 25%;

            left: -300px;

            transform: scale(0.65);

            opacity: 0.5;

            animation:
                cloudMove2 105s linear infinite;
        }


        #cloud3 {

            top: 8%;

            left: -400px;

            transform: scale(0.45);

            opacity: 0.4;

            animation:
                cloudMove3 130s linear infinite;
        }


        @keyframes cloudMove1 {

            from {
                transform: translateX(0) scale(0.9);
            }

            to {
                transform:
                    translateX(calc(100vw + 500px))
                    scale(0.9);
            }

        }


        @keyframes cloudMove2 {

            from {
                transform: translateX(0) scale(0.65);
            }

            to {
                transform:
                    translateX(calc(100vw + 600px))
                    scale(0.65);
            }

        }


        @keyframes cloudMove3 {

            from {
                transform: translateX(0) scale(0.45);
            }

            to {
                transform:
                    translateX(calc(100vw + 700px))
                    scale(0.45);
            }

        }


        /* =========================
           HOTSPOTY
        ========================= */

        .location {

            position: absolute;

            width: 80px;
            height: 80px;

            transform: translate(-50%, -50%);

            border: none;

            padding: 0;
            margin: 0;

            background: transparent;

            cursor: pointer;

            z-index: 30;

            border-radius: 50%;

            outline: none;

            appearance: none;
        }


        /* =========================
           LAS
        ========================= */

        #forest {

            left: 35.45%;
            top: 45.08%;
        }


        /* =========================
           JEZIORO
        ========================= */

        #lake {

            left: 54.85%;
            top: 44.54%;

            display: none;
        }


        /* =========================
           ZAMEK
        ========================= */

        #castle {

            left: 72.727%;
            top: 44.541%;

            width: 5.985%;
            height: 9.622%;

            transform: translate(0, 0);

            border-radius: 0;

            clip-path: polygon(
                0% 9.091%,
                93.151% 0%,
                100% 98.966%,
                6.757% 100%
            );

            display: none;
        }


        /* =========================
           JASKINIA
        ========================= */

        #cave {

            left: 86.82%;
            top: 22.81%;

            display: none;
        }


        /* =========================
           EKRAN ZAGADKI
        ========================= */

        #puzzle-screen {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.82);

            z-index: 100;
        }


        /* =========================
           PUDEŁKO
        ========================= */

        #puzzle-box {

            width: min(650px, 90vw);

            max-height: 90vh;

            overflow-y: auto;

            padding: 40px;

            border-radius: 24px;

            background: #171717;

            color: white;

            text-align: center;

            box-shadow:
                0 0 40px rgba(0, 0, 0, 0.8);

            border:
                1px solid rgba(255, 255, 255, 0.12);
        }


        #puzzle-box h1 {

            margin-top: 0;

            font-size: 36px;
        }


        #puzzle-box p {

            font-size: 18px;

            line-height: 1.6;
        }


        /* =========================
           ODPOWIEDŹ
        ========================= */

        #answer {

            width: 220px;

            padding: 12px;

            margin-top: 10px;

            border: 2px solid white;

            border-radius: 8px;

            font-size: 18px;

            text-align: center;

            outline: none;
        }


        /* =========================
           PRZYCISKI
        ========================= */

        .puzzle-button {

            margin: 15px 5px 0;

            padding: 12px 22px;

            border: 2px solid white;

            border-radius: 10px;

            font-size: 16px;

            cursor: pointer;

            background: white;

            color: black;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                color 0.15s ease;
        }


        .puzzle-button:hover {

            transform: translateY(-2px);

            background: black;

            color: white;
        }


        /* =========================
           PODPOWIEDŹ
        ========================= */

        #hint-button {

            display: inline-block;
        }


        #hint-box {

            display: none;

            margin-top: 20px;

            padding: 18px;

            border-radius: 14px;

            background: #222;

            border:
                1px solid rgba(255, 255, 255, 0.2);

            font-size: 17px;

            line-height: 1.6;
        }


        /* =========================
           PYTANIE O KOLEJNĄ PODPOWIEDŹ
        ========================= */

        #hint-question {

            display: none;

            margin-top: 18px;

            font-size: 17px;

            line-height: 1.5;
        }


        #hint-yes,
        #hint-no {

            display: none;

            margin: 10px 4px 0;

            padding: 9px 18px;

            border: 2px solid white;

            border-radius: 9px;

            cursor: pointer;

            font-size: 15px;

            background: white;

            color: black;
        }


        #hint-yes:hover,
        #hint-no:hover {

            background: black;

            color: white;
        }


        /* =========================
           WIADOMOŚĆ
        ========================= */

        #message {

            min-height: 28px;

            margin-top: 18px;

            font-size: 18px;
        }

    </style>

</head>


<body>


<div id="game">


    <div id="world">


        <!-- MAPA -->

        <img
            id="game-map"
            src="Storybook-World-Map.png"
            alt="Mapa gry"
        >


        <!-- CHMURY -->

        <div id="cloud1" class="cloud"></div>
        <div id="cloud2" class="cloud"></div>
        <div id="cloud3" class="cloud"></div>


        <!-- DZIEŃ / NOC -->

        <div id="day-night"></div>


        <!-- =========================
             LAS
        ========================= -->

        <button
            id="forest"
            class="location"
            onclick="openForest()"
            aria-label="Forest"
        ></button>


        <!-- =========================
             JEZIORO
        ========================= -->

        <button
            id="lake"
            class="location"
            onclick="openLake()"
            aria-label="Lake + Bridge"
        ></button>


        <!-- =========================
             ZAMEK
        ========================= -->

        <button
            id="castle"
            class="location"
            onclick="openCastle()"
            aria-label="Castle"
        ></button>


        <!-- =========================
             JASKINIA
        ========================= -->

        <button
            id="cave"
            class="location"
            onclick="openCave()"
            aria-label="Cave"
        ></button>


    </div>

</div>



<!-- =========================
     EKRAN ZAGADKI
========================= -->

<div id="puzzle-screen">


    <div id="puzzle-box">


        <h1 id="puzzle-title">
            🌲 Las
        </h1>


        <p id="puzzle-description">
            W lesie znajdujesz dziwną tabliczkę.
        </p>


        <p id="puzzle-question">

            <strong>
                46 368 &nbsp;&nbsp;
                10 946 &nbsp;&nbsp;
                121 393 &nbsp;&nbsp;
                28 657 &nbsp;&nbsp;
                75 025 &nbsp;&nbsp;
                17 711
            </strong>

        </p>


        <p id="puzzle-instruction">
            Jaka liczba powinna pojawić się jako następna?
        </p>


        <!-- ODPOWIEDŹ -->

        <input
            id="answer"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Wpisz liczbę"
        >


        <br>


        <!-- SPRAWDŹ -->

        <button
            id="check-button"
            class="puzzle-button"
            onclick="checkAnswer()"
        >
            Sprawdź
        </button>


        <!-- PODPOWIEDŹ -->

        <button
            id="hint-button"
            class="puzzle-button"
            onclick="showHint()"
        >
            💭 „Coś mi to przypomina…”
        </button>


        <!-- WRÓĆ -->

        <button
            class="puzzle-button"
            onclick="closePuzzle()"
        >
            Wróć
        </button>


        <!-- TREŚĆ PODPOWIEDZI -->

        <div id="hint-box"></div>


        <!-- PYTANIE -->

        <div id="hint-question">

            <span id="hint-question-text">
                Chcesz drugą podpowiedź?
            </span>

            <br>


            <button
                id="hint-yes"
                onclick="showSecondHint()"
            >
                Tak
            </button>


            <button
                id="hint-no"
                onclick="hideHintQuestion()"
            >
                Nie
            </button>

        </div>


        <!-- WIADOMOŚĆ -->

        <div id="message"></div>


    </div>

</div>



<script>


    /* ==================================================
       POSTĘP GRY
    ================================================== */

    let lakeUnlocked = false;

    let castleUnlocked = false;

    let caveUnlocked = false;


    /*
       0 = żadnej podpowiedzi
       1 = pierwsza pokazana
       2 = pytanie o drugą
       3 = druga pokazana
       4 = pytanie o trzecią
       5 = trzecia pokazana
    */

    let hintStage = 0;



    /* ==================================================
       RUCH MAPY ZA MYSZKĄ
    ================================================== */

    document.addEventListener(
        "mousemove",
        function(event) {

            const x =
                (event.clientX /
                window.innerWidth) - 0.5;


            const y =
                (event.clientY /
                window.innerHeight) - 0.5;


            const moveX = x * 28;

            const moveY = y * 22;


            document
                .getElementById("world")
                .style.transform =
                `translate3d(
                    ${moveX}px,
                    ${moveY}px,
                    0
                )`;

        }
    );



    /* ==================================================
       FORMATOWANIE LICZB

       196418
       ↓
       196 418
    ================================================== */

    document
        .getElementById("answer")
        .addEventListener(
            "input",
            function() {

                let value =
                    this.value.replace(/\D/g, "");


                value =
                    value.replace(
                        /\B(?=(\d{3})+(?!\d))/g,
                        " "
                    );


                this.value = value;

            }
        );



    /* ==================================================
       OTWARCIE LASU
    ================================================== */

    function openForest() {

        resetPuzzle();


        document
            .getElementById("puzzle-title")
            .textContent =
            "🌲 Las";


        document
            .getElementById("puzzle-description")
            .textContent =
            "W lesie znajdujesz dziwną tabliczkę.";


        document
            .getElementById("puzzle-question")
            .innerHTML =
            "<strong>" +
            "46 368 &nbsp;&nbsp; " +
            "10 946 &nbsp;&nbsp; " +
            "121 393 &nbsp;&nbsp; " +
            "28 657 &nbsp;&nbsp; " +
            "75 025 &nbsp;&nbsp; " +
            "17 711" +
            "</strong>";


        document
            .getElementById("puzzle-instruction")
            .textContent =
            "Jaka liczba powinna pojawić się jako następna?";


        showPuzzle();

    }



    /* ==================================================
       JEZIORO
    ================================================== */

    function openLake() {

        resetPuzzle();


        document
            .getElementById("puzzle-title")
            .textContent =
            "🌊 Lake + Bridge";


        document
            .getElementById("puzzle-description")
            .textContent =
            "Przy jeziorze czeka na Ciebie kolejna zagadka.";


        document
            .getElementById("puzzle-question")
            .innerHTML =
            "Wkrótce znajdzie się tutaj zagadka.";


        document
            .getElementById("puzzle-instruction")
            .textContent =
            "";


        hideAnswer();


        showPuzzle();

    }



    /* ==================================================
       ZAMEK
    ================================================== */

    function openCastle() {

        resetPuzzle();


        document
            .getElementById("puzzle-title")
            .textContent =
            "🏰 Zamek";


        document
            .getElementById("puzzle-description")
            .textContent =
            "Przed Tobą stoi zamek.";


        document
            .getElementById("puzzle-question")
            .innerHTML =
            "Wkrótce znajdzie się tutaj zagadka.";


        document
            .getElementById("puzzle-instruction")
            .textContent =
            "";


        hideAnswer();


        showPuzzle();

    }



    /* ==================================================
       JASKINIA
    ================================================== */

    function openCave() {

        resetPuzzle();


        document
            .getElementById("puzzle-title")
            .textContent =
            "🕳️ Jaskinia";


        document
            .getElementById("puzzle-description")
            .textContent =
            "Wchodzisz coraz głębiej.";


        document
            .getElementById("puzzle-question")
            .innerHTML =
            "Wkrótce znajdzie się tutaj zagadka.";


        document
            .getElementById("puzzle-instruction")
            .textContent =
            "";


        hideAnswer();


        showPuzzle();

    }



    /* ==================================================
       POKAŻ EKRAN
    ================================================== */

    function showPuzzle() {

        document
            .getElementById("puzzle-screen")
            .style.display =
            "flex";

    }



    /* ==================================================
       RESET ZAGADKI
    ================================================== */

    function resetPuzzle() {

        hintStage = 0;


        document
            .getElementById("answer")
            .value =
            "";


        document
            .getElementById("answer")
            .style.display =
            "inline-block";


        document
            .getElementById("check-button")
            .style.display =
            "inline-block";


        document
            .getElementById("hint-button")
            .style.display =
            "inline-block";


        document
            .getElementById("hint-box")
            .style.display =
            "none";


        document
            .getElementById("hint-box")
            .textContent =
            "";


        document
            .getElementById("hint-question")
            .style.display =
            "none";


        document
            .getElementById("hint-yes")
            .style.display =
            "none";


        document
            .getElementById("hint-no")
            .style.display =
            "none";


        document
            .getElementById("message")
            .textContent =
            "";

    }



    /* ==================================================
       UKRYJ ODPOWIEDŹ
    ================================================== */

    function hideAnswer() {

        document
            .getElementById("answer")
            .style.display =
            "none";


        document
            .getElementById("check-button")
            .style.display =
            "none";


        document
            .getElementById("hint-button")
            .style.display =
            "none";

    }



    /* ==================================================
       PODPOWIEDZI — GŁÓWNY PRZYCISK
    ================================================== */

    function showHint() {

        const hintBox =
            document.getElementById(
                "hint-box"
            );


        const hintQuestion =
            document.getElementById(
                "hint-question"
            );


        const hintYes =
            document.getElementById(
                "hint-yes"
            );


        const hintNo =
            document.getElementById(
                "hint-no"
            );


        const hintQuestionText =
            document.getElementById(
                "hint-question-text"
            );



        /*
           PIERWSZA PODPOWIEDŹ
        */

        if (hintStage === 0) {

            hintStage = 1;


            hintBox.textContent =
                "„Kiedyś powiedziałeś mi, że najlepiej wszystko sobie po kolei ułożyć, zanim ruszysz na głęboką wodę.”";


            hintBox.style.display =
                "block";


            return;

        }



        /*
           PYTANIE O DRUGĄ PODPOWIEDŹ
        */

        if (hintStage === 1) {

            hintStage = 2;


            hintQuestionText.textContent =
                "Chcesz drugą podpowiedź?";


            hintQuestion.style.display =
                "block";


            hintYes.textContent =
                "Tak";


            hintYes.style.display =
                "inline-block";


            hintNo.textContent =
                "Nie";


            hintNo.style.display =
                "inline-block";


            return;

        }



        /*
           PO DRUGIEJ PODPOWIEDZI
           PYTANIE O TRZECIĄ
        */

        if (hintStage === 3) {

            hintStage = 4;


            hintQuestionText.textContent =
                "Chcesz trzecią podpowiedź?";


            hintQuestion.style.display =
                "block";


            hintYes.textContent =
                "Napewno";


            hintYes.style.display =
                "inline-block";


            hintNo.textContent =
                "Nie";


            hintNo.style.display =
                "inline-block";


            return;

        }

    }



    /* ==================================================
       DRUGA PODPOWIEDŹ
    ================================================== */

    function showSecondHint() {

        document
            .getElementById("hint-box")
            .textContent =
            "Posortuj liczby od najmniejszej.";


        document
            .getElementById("hint-box")
            .style.display =
            "block";


        document
            .getElementById("hint-question")
            .style.display =
            "none";


        document
            .getElementById("hint-yes")
            .style.display =
            "none";


        document
            .getElementById("hint-no")
            .style.display =
            "none";


        /*
           Druga podpowiedź została pokazana.
           Następne kliknięcie głównego
           przycisku uruchomi pytanie
           o trzecią.
        */

        hintStage = 3;

    }



    /* ==================================================
       TRZECIA PODPOWIEDŹ
    ================================================== */

    function showThirdHint() {

        document
            .getElementById("hint-box")
            .textContent =
            "Fibonacci";


        document
            .getElementById("hint-box")
            .style.display =
            "block";


        document
            .getElementById("hint-question")
            .style.display =
            "none";


        document
            .getElementById("hint-yes")
            .style.display =
            "none";


        document
            .getElementById("hint-no")
            .style.display =
            "none";


        hintStage = 5;

    }



    /* ==================================================
       NIE
    ================================================== */

    function hideHintQuestion() {

        document
            .getElementById("hint-question")
            .style.display =
            "none";


        document
            .getElementById("hint-yes")
            .style.display =
            "none";


        document
            .getElementById("hint-no")
            .style.display =
            "none";

    }



    /* ==================================================
       ZAMKNIJ OKNO
    ================================================== */

    function closePuzzle() {

        document
            .getElementById("puzzle-screen")
            .style.display =
            "none";


        document
            .getElementById("message")
            .textContent =
            "";


        document
            .getElementById("answer")
            .value =
            "";


        hintStage = 0;

    }



    /* ==================================================
       SPRAWDŹ ODPOWIEDŹ
    ================================================== */

    function checkAnswer() {

        const answer =
            document
                .getElementById("answer")
                .value
                .replace(/\s/g, "");



        /*
           POPRAWNA ODPOWIEDŹ
        */

        if (answer === "196418") {

            lakeUnlocked = true;


            /*
               ODBLOKOWANIE JEZIORA
            */

            document
                .getElementById("lake")
                .style.display =
                "block";


            document
                .getElementById("message")
                .textContent =
                "✓ Poprawnie! Ścieżka prowadzi dalej...";


            /*
               Zamknięcie okna
            */

            setTimeout(
                function() {

                    closePuzzle();

                },
                700
            );


            return;

        }



        /*
           BŁĘDNA ODPOWIEDŹ
        */

        document
            .getElementById("message")
            .textContent =
            "✗ Spróbuj jeszcze raz.";

    }

</script>

</body>
</html>
