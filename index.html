<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nasza Gra</title>


<style>

/* ==================================================
   PODSTAWY
================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;
}


/* ==================================================
   GRA
================================================== */

#game {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: black;
}


/* ==================================================
   ŚWIAT
================================================== */

#world {

    position: absolute;

    left: -4vw;
    top: -4vh;

    width: 108vw;
    height: 108vh;

    transform: translate3d(0, 0, 0);

    transition:
        transform 0.15s ease-out;

    will-change: transform;
}


/* ==================================================
   MAPA
================================================== */

#game-map {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    display: block;

    user-select: none;

    pointer-events: none;
}


/* ==================================================
   CYKL DNIA I NOCY
================================================== */

#day-night {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 20;

    background:
        rgba(0, 0, 0, 0);

    animation:
        dayNightCycle 60s linear infinite;

    mix-blend-mode: multiply;
}


@keyframes dayNightCycle {

    0% {
        background:
            rgba(0, 0, 0, 0);
    }

    25% {
        background:
            rgba(0, 0, 0, 0);
    }

    50% {
        background:
            rgba(10, 15, 55, 0.48);
    }

    75% {
        background:
            rgba(10, 15, 55, 0.20);
    }

    100% {
        background:
            rgba(0, 0, 0, 0);
    }
}


/* ==================================================
   CHMURY
================================================== */

.cloud {

    position: absolute;

    z-index: 10;

    width: 180px;
    height: 55px;

    background:
        rgba(255, 255, 255, 0.55);

    border-radius: 50px;

    filter: blur(1px);

    opacity: 0.75;

    pointer-events: none;
}


.cloud::before,
.cloud::after {

    content: "";

    position: absolute;

    background:
        rgba(255, 255, 255, 0.55);

    border-radius: 50%;
}


.cloud::before {

    width: 75px;
    height: 75px;

    left: 28px;
    top: -35px;
}


.cloud::after {

    width: 95px;
    height: 95px;

    right: 25px;
    top: -48px;
}


#cloud1 {

    top: 12%;

    left: -220px;

    transform:
        scale(0.9);

    animation:
        cloudMove1 75s linear infinite;
}


#cloud2 {

    top: 25%;

    left: -300px;

    transform:
        scale(0.65);

    opacity: 0.5;

    animation:
        cloudMove2 105s linear infinite;
}


#cloud3 {

    top: 8%;

    left: -400px;

    transform:
        scale(0.45);

    opacity: 0.4;

    animation:
        cloudMove3 130s linear infinite;
}


@keyframes cloudMove1 {

    from {

        transform:
            translateX(0)
            scale(0.9);
    }

    to {

        transform:
            translateX(calc(100vw + 500px))
            scale(0.9);
    }
}


@keyframes cloudMove2 {

    from {

        transform:
            translateX(0)
            scale(0.65);
    }

    to {

        transform:
            translateX(calc(100vw + 600px))
            scale(0.65);
    }
}


@keyframes cloudMove3 {

    from {

        transform:
            translateX(0)
            scale(0.45);
    }

    to {

        transform:
            translateX(calc(100vw + 700px))
            scale(0.45);
    }
}


/* ==================================================
   HOTSPOTY
================================================== */

.location {

    position: absolute;

    width: 80px;
    height: 80px;

    transform:
        translate(-50%, -50%);

    border: none;

    padding: 0;
    margin: 0;

    background:
        transparent;

    cursor: pointer;

    z-index: 30;

    border-radius: 50%;

    outline: none;

    appearance: none;
}


/* ==================================================
   LAS
================================================== */

#forest {

    left: 35.45%;
    top: 45.08%;
}


/* ==================================================
   JEZIORO
================================================== */

#lake {

    left: 54.85%;
    top: 44.54%;

    display: none;
}


/* ==================================================
   ZAMEK
================================================== */

#castle {

    left: 72.727%;
    top: 44.541%;

    width: 5.985%;
    height: 9.622%;

    transform:
        translate(0, 0);

    border-radius: 0;

    clip-path: polygon(

        0% 9.091%,
        93.151% 0%,
        100% 98.966%,
        6.757% 100%

    );

    display: none;
}


/* ==================================================
   JASKINIA
================================================== */

#cave {

    left: 86.82%;
    top: 22.81%;

    display: none;
}


/* ==================================================
   EKRAN ZAGADKI
================================================== */

#puzzle-screen {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0, 0, 0, 0.82);

    z-index: 100;
}


/* ==================================================
   PUDEŁKO
================================================== */

#puzzle-box {

    width:
        min(650px, 90vw);

    max-height:
        90vh;

    overflow-y:
        auto;

    padding:
        40px;

    border-radius:
        24px;

    background:
        #171717;

    color:
        white;

    text-align:
        center;

    box-shadow:
        0 0 40px rgba(0, 0, 0, 0.8);

    border:
        1px solid
        rgba(255, 255, 255, 0.12);
}


#puzzle-box h1 {

    margin-top:
        0;

    font-size:
        36px;
}


#puzzle-box p {

    font-size:
        18px;

    line-height:
        1.6;
}


/* ==================================================
   ODPOWIEDŹ LASU
================================================== */

#answer {

    width:
        220px;

    padding:
        12px;

    margin-top:
        10px;

    border:
        2px solid white;

    border-radius:
        8px;

    font-size:
        18px;

    text-align:
        center;

    outline:
        none;
}


/* ==================================================
   PRZYCISKI
================================================== */

.puzzle-button {

    margin:
        15px 5px 0;

    padding:
        12px 22px;

    border:
        2px solid white;

    border-radius:
        10px;

    font-size:
        16px;

    cursor:
        pointer;

    background:
        white;

    color:
        black;

    transition:
        transform 0.15s ease,
        background 0.15s ease,
        color 0.15s ease;
}


.puzzle-button:hover {

    transform:
        translateY(-2px);

    background:
        black;

    color:
        white;
}


/* ==================================================
   ODPOWIEDZI JEZIORA
================================================== */

.lake-option {

    display:
        block;

    width:
        260px;

    margin:
        12px auto;

    padding:
        14px 20px;

    border:
        2px solid white;

    border-radius:
        12px;

    background:
        white;

    color:
        black;

    font-size:
        18px;

    cursor:
        pointer;

    transition:
        transform 0.15s ease,
        background 0.15s ease,
        color 0.15s ease;
}


.lake-option:hover {

    transform:
        translateY(-2px);

    background:
        black;

    color:
        white;
}


/* ==================================================
   PODPOWIEDŹ
================================================== */

#hint-box {

    display:
        none;

    margin-top:
        20px;

    padding:
        18px;

    border-radius:
        14px;

    background:
        #222;

    border:
        1px solid
        rgba(255, 255, 255, 0.2);

    font-size:
        17px;

    line-height:
        1.6;
}


/* ==================================================
   PYTANIE O PODPOWIEDŹ
================================================== */

#hint-question {

    display:
        none;

    margin-top:
        18px;

    font-size:
        17px;

    line-height:
        1.5;
}


#hint-yes,
#hint-no {

    display:
        none;

    margin:
        10px 4px 0;

    padding:
        9px 18px;

    border:
        2px solid white;

    border-radius:
        9px;

    cursor:
        pointer;

    font-size:
        15px;

    background:
        white;

    color:
        black;
}


#hint-yes:hover,
#hint-no:hover {

    background:
        black;

    color:
        white;
}


/* ==================================================
   WIADOMOŚĆ
================================================== */

#message {

    min-height:
        28px;

    margin-top:
        18px;

    font-size:
        18px;
}

</style>

</head>


<body>


<!-- ==================================================
     MAPA
================================================== -->

<div id="game">

    <div id="world">


        <img
            id="game-map"
            src="Storybook-World-Map.png"
            alt="Mapa gry"
        >


        <!-- CHMURY -->

        <div
            id="cloud1"
            class="cloud">
        </div>


        <div
            id="cloud2"
            class="cloud">
        </div>


        <div
            id="cloud3"
            class="cloud">
        </div>


        <!-- CYKL DNIA I NOCY -->

        <div
            id="day-night">
        </div>


        <!-- LAS -->

        <button
            id="forest"
            class="location"
            onclick="openForest()"
            aria-label="Forest">
        </button>


        <!-- JEZIORO -->

        <button
            id="lake"
            class="location"
            onclick="openLake()"
            aria-label="Lake + Bridge">
        </button>


        <!-- ZAMEK -->

        <button
            id="castle"
            class="location"
            onclick="openCastle()"
            aria-label="Castle">
        </button>


        <!-- JASKINIA -->

        <button
            id="cave"
            class="location"
            onclick="openCave()"
            aria-label="Cave">
        </button>


    </div>

</div>



<!-- ==================================================
     OKNO ZAGADKI
================================================== -->

<div id="puzzle-screen">


    <div id="puzzle-box">


        <h1 id="puzzle-title">
            🌲 Las
        </h1>


        <p id="puzzle-description">
            W lesie znajdujesz dziwną tabliczkę.
        </p>


        <p id="puzzle-question">
        </p>


        <p id="puzzle-instruction">
        </p>


        <!-- ODPOWIEDŹ -->

        <input
            id="answer"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Wpisz liczbę"
        >


        <br>


        <!-- SPRAWDŹ -->

        <button
            id="check-button"
            class="puzzle-button"
            onclick="checkForestAnswer()">
            Sprawdź
        </button>


        <!-- PODPOWIEDŹ -->

        <button
            id="hint-button"
            class="puzzle-button"
            onclick="showHint()">

            💭 „Coś mi to przypomina…”

        </button>


        <!-- WRÓĆ -->

        <button
            class="puzzle-button"
            onclick="closePuzzle()">

            Wróć

        </button>


        <!-- PODPOWIEDŹ -->

        <div id="hint-box">
        </div>


        <!-- PYTANIE -->

        <div id="hint-question">

            <span
                id="hint-question-text">
            </span>


            <br>


            <button
                id="hint-yes"
                onclick="answerHintYes()">
                Tak
            </button>


            <button
                id="hint-no"
                onclick="hideHintQuestion()">
                Nie
            </button>

        </div>


        <div id="message">
        </div>


    </div>

</div>



<script>


/* ==================================================
   POSTĘP
================================================== */

let lakeUnlocked =
    false;

let castleUnlocked =
    false;

let caveUnlocked =
    false;


/*
   0 = brak
   1 = pierwsza
   2 = pytanie o drugą
   3 = druga
   4 = pytanie o ostatnią
   5 = ostatnia
*/

let hintStage =
    0;


/*
   Aktualna lokacja
*/

let currentLocation =
    "forest";



/* ==================================================
   MAPA PODĄŻA ZA MYSZKĄ
================================================== */

document.addEventListener(
    "mousemove",
    function(event) {

        const x =
            (event.clientX /
            window.innerWidth) - 0.5;


        const y =
            (event.clientY /
            window.innerHeight) - 0.5;


        const moveX =
            x * 28;


        const moveY =
            y * 22;


        document
            .getElementById("world")
            .style.transform =
            `translate3d(
                ${moveX}px,
                ${moveY}px,
                0
            )`;

    }
);



/* ==================================================
   FORMATOWANIE LICZB
================================================== */

document
    .getElementById("answer")
    .addEventListener(
        "input",
        function() {

            let value =
                this.value
                    .replace(/\D/g, "");


            value =
                value.replace(
                    /\B(?=(\d{3})+(?!\d))/g,
                    " "
                );


            this.value =
                value;

        }
    );



/* ==================================================
   POKAŻ PUDEŁKO
================================================== */

function showPuzzle() {

    document
        .getElementById("puzzle-screen")
        .style.display =
        "flex";

}



/* ==================================================
   RESET PODPOWIEDZI
================================================== */

function resetHints() {

    hintStage =
        0;


    document
        .getElementById("hint-box")
        .style.display =
        "none";


    document
        .getElementById("hint-box")
        .textContent =
        "";


    document
        .getElementById("hint-question")
        .style.display =
        "none";


    document
        .getElementById("hint-yes")
        .style.display =
        "none";


    document
        .getElementById("hint-no")
        .style.display =
        "none";


    document
        .getElementById("hint-yes")
        .textContent =
        "Tak";


    document
        .getElementById("hint-no")
        .textContent =
        "Nie";

}



/* ==================================================
   RESET OKNA
================================================== */

function resetPuzzle() {

    resetHints();


    document
        .getElementById("message")
        .textContent =
        "";


    document
        .getElementById("answer")
        .value =
        "";

}



/* ==================================================
   LAS
================================================== */

function openForest() {

    currentLocation =
        "forest";


    resetPuzzle();


    document
        .getElementById("puzzle-title")
        .textContent =
        "🌲 Las";


    document
        .getElementById("puzzle-description")
        .textContent =
        "W lesie znajdujesz dziwną tabliczkę.";


    document
        .getElementById("puzzle-question")
        .innerHTML =
        `
        <strong>
            46 368 &nbsp;&nbsp;
            10 946 &nbsp;&nbsp;
            121 393 &nbsp;&nbsp;
            28 657 &nbsp;&nbsp;
            75 025 &nbsp;&nbsp;
            17 711
        </strong>
        `;


    document
        .getElementById("puzzle-instruction")
        .textContent =
        "Jaka liczba powinna pojawić się jako następna?";


    document
        .getElementById("answer")
        .style.display =
        "inline-block";


    document
        .getElementById("check-button")
        .style.display =
        "inline-block";


    document
        .getElementById("hint-button")
        .style.display =
        "inline-block";


    showPuzzle();

}



/* ==================================================
   JEZIORO
================================================== */

function openLake() {

    currentLocation =
        "lake";


    resetPuzzle();


    document
        .getElementById("puzzle-title")
        .textContent =
        "🌊 Jezioro";


    document
        .getElementById("puzzle-description")
        .textContent =
        "Przy jeziorze znajduje się most. Musisz znaleźć właściwy podział.";


    document
        .getElementById("puzzle-question")
        .innerHTML =
        `
        <strong>
            Most ma 1309 jednostek.
        </strong>
        `;


    document
        .getElementById("puzzle-instruction")
        .textContent =
        "Wybierz właściwy podział:";


    document
        .getElementById("answer")
        .style.display =
        "none";


    document
        .getElementById("check-button")
        .style.display =
        "none";


    createLakeOptions();


    showPuzzle();

}



/* ==================================================
   ODPOWIEDZI JEZIORA
================================================== */

function createLakeOptions() {

    const question =
        document
            .getElementById("puzzle-question");


    /*
       Usuwamy stare opcje
    */

    document
        .querySelectorAll(".lake-option")
        .forEach(
            element => element.remove()
        );


    const options = [

        "700 + 609",

        "800 + 509",

        "809 + 500",

        "900 + 409"

    ];


    options.forEach(
        function(option) {

            const button =
                document.createElement("button");


            button.className =
                "lake-option";


            button.textContent =
                option;


            button.onclick =
                function() {

                    checkLakeAnswer(option);

                };


            question
                .insertAdjacentElement(
                    "afterend",
                    button
                );

        }
    );

}



/* ==================================================
   SPRAWDZANIE JEZIORA
================================================== */

function checkLakeAnswer(option) {

    if (
        option ===
        "809 + 500"
    ) {

        document
            .getElementById("message")
            .textContent =
            "✓ Poprawnie! Most się otwiera...";


        /*
           ZAMEK ODBLOKOWANY
        */

        castleUnlocked =
            true;


        document
            .getElementById("castle")
            .style.display =
            "block";


        setTimeout(
            function() {

                closePuzzle();

            },
            700
        );


        return;

    }


    document
        .getElementById("message")
        .textContent =
        "✗ To nie ta proporcja. Spróbuj jeszcze raz.";

}



/* ==================================================
   ZAMEK
================================================== */

function openCastle() {

    currentLocation =
        "castle";


    resetPuzzle();


    document
        .getElementById("puzzle-title")
        .textContent =
        "🏰 Zamek";


    document
        .getElementById("puzzle-description")
        .textContent =
        "Przed Tobą stoi zamek.";


    document
        .getElementById("puzzle-question")
        .innerHTML =
        "Wkrótce znajdzie się tutaj zagadka.";


    document
        .getElementById("puzzle-instruction")
        .textContent =
        "";


    document
        .getElementById("answer")
        .style.display =
        "none";


    document
        .getElementById("check-button")
        .style.display =
        "none";


    document
        .getElementById("hint-button")
        .style.display =
        "none";


    showPuzzle();

}



/* ==================================================
   JASKINIA
================================================== */

function openCave() {

    currentLocation =
        "cave";


    resetPuzzle();


    document
        .getElementById("puzzle-title")
        .textContent =
        "🕳️ Jaskinia";


    document
        .getElementById("puzzle-description")
        .textContent =
        "Wchodzisz coraz głębiej.";


    document
        .getElementById("puzzle-question")
        .innerHTML =
        "Wkrótce znajdzie się tutaj zagadka.";


    document
        .getElementById("puzzle-instruction")
        .textContent =
        "";


    document
        .getElementById("answer")
        .style.display =
        "none";


    document
        .getElementById("check-button")
        .style.display =
        "none";


    document
        .getElementById("hint-button")
        .style.display =
        "none";


    showPuzzle();

}



/* ==================================================
   PODPOWIEDZI
================================================== */

function showHint() {


    /*
       LAS:
       PIERWSZA
    */

    if (
        currentLocation === "forest"
        &&
        hintStage === 0
    ) {

        hintStage =
            1;


        document
            .getElementById("hint-box")
            .textContent =
            "„Kiedyś powiedziałeś mi, że najlepiej wszystko sobie po kolei ułożyć, zanim ruszysz na głęboką wodę.”";


        document
            .getElementById("hint-box")
            .style.display =
            "block";


        return;

    }



    /*
       LAS:
       PYTANIE O DRUGĄ
    */

    if (
        currentLocation === "forest"
        &&
        hintStage === 1
    ) {

        hintStage =
            2;


        askForHint(
            "Chcesz drugą podpowiedź?",
            "Tak"
        );


        return;

    }



    /*
       LAS:
       PYTANIE O OSTATNIĄ
    */

    if (
        currentLocation === "forest"
        &&
        hintStage === 3
    ) {

        hintStage =
            4;


        askForHint(
            "Chcesz ostatnią podpowiedź?",
            "Napewno"
        );


        return;

    }



    /*
       JEZIORO:
       PIERWSZA
    */

    if (
        currentLocation === "lake"
        &&
        hintStage === 0
    ) {

        hintStage =
            1;


        document
            .getElementById("hint-box")
            .textContent =
            "„Kiedyś powiedziałeś mi, że we wszystkim trzeba znaleźć odpowiednie proporcje. Chyba pora przypomnieć sobie tę Złotą radę.”";


        document
            .getElementById("hint-box")
            .style.display =
            "block";


        return;

    }



    /*
       JEZIORO:
       PYTANIE O OSTATNIĄ
    */

    if (
        currentLocation === "lake"
        &&
        hintStage === 1
    ) {

        hintStage =
            4;


        askForHint(
            "Chcesz ostatnią podpowiedź?",
            "Napewno"
        );


        return;

    }

}



/* ==================================================
   PYTANIE O PODPOWIEDŹ
================================================== */

function askForHint(
    text,
    yesText
) {

    document
        .getElementById("hint-question-text")
        .textContent =
        text;


    document
        .getElementById("hint-yes")
        .textContent =
        yesText;


    document
        .getElementById("hint-no")
        .textContent =
        "Nie";


    document
        .getElementById("hint-question")
        .style.display =
        "block";


    document
        .getElementById("hint-yes")
        .style.display =
        "inline-block";


    document
        .getElementById("hint-no")
        .style.display =
        "inline-block";

}



/* ==================================================
   TAK / NAPEWNO
================================================== */

function answerHintYes() {


    /*
       LAS — DRUGA
    */

    if (
        currentLocation === "forest"
        &&
        hintStage === 2
    ) {

        document
            .getElementById("hint-box")
            .textContent =
            "Posortuj liczby od najmniejszej.";


        document
            .getElementById("hint-box")
            .style.display =
            "block";


        hideHintQuestion();


        hintStage =
            3;


        return;

    }



    /*
       LAS — OSTATNIA
    */

    if (
        currentLocation === "forest"
        &&
        hintStage === 4
    ) {

        document
            .getElementById("hint-box")
            .textContent =
            "Fibonacci";


        document
            .getElementById("hint-box")
            .style.display =
            "block";


        hideHintQuestion();


        hintStage =
            5;


        return;

    }



    /*
       JEZIORO — OSTATNIA
    */

    if (
        currentLocation === "lake"
        &&
        hintStage === 4
    ) {

        document
            .getElementById("hint-box")
            .textContent =
            "Poprawna odpowiedź to ta, z której wychodzi złota proporcja.";


        document
            .getElementById("hint-box")
            .style.display =
            "block";


        hideHintQuestion();


        hintStage =
            5;


        return;

    }

}



/* ==================================================
   NIE
================================================== */

function hideHintQuestion() {

    document
        .getElementById("hint-question")
        .style.display =
        "none";


    document
        .getElementById("hint-yes")
        .style.display =
        "none";


    document
        .getElementById("hint-no")
        .style.display =
        "none";

}



/* ==================================================
   SPRAWDZANIE LASU
================================================== */

function checkForestAnswer() {

    const answer =
        document
            .getElementById("answer")
            .value
            .replace(/\s/g, "");


    if (
        answer ===
        "196418"
    ) {

        lakeUnlocked =
            true;


        document
            .getElementById("lake")
            .style.display =
            "block";


        document
            .getElementById("message")
            .textContent =
            "✓ Poprawnie! Ścieżka prowadzi dalej...";


        setTimeout(
            function() {

                closePuzzle();

            },
            700
        );


        return;

    }


    document
        .getElementById("message")
        .textContent =
        "✗ Spróbuj jeszcze raz.";

}



/* ==================================================
   ZAMKNIĘCIE
================================================== */

function closePuzzle() {

    document
        .getElementById("puzzle-screen")
        .style.display =
        "none";


    document
        .getElementById("message")
        .textContent =
        "";

}

</script>
