<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nasza Gra</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#game {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: black;
}

#world {
    position: absolute;
    left: -4vw;
    top: -4vh;
    width: 108vw;
    height: 108vh;

    transform: translate3d(0, 0, 0);

    transition:
        transform 0.15s ease-out;

    will-change: transform;
}

#game-map {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;
    display: block;

    user-select: none;
    pointer-events: none;
}


/* ==================================================
   CYKL DNIA I NOCY
================================================== */

#day-night {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 20;

    background:
        rgba(0, 0, 0, 0);

    animation:
        dayNightCycle 60s linear infinite;

    mix-blend-mode: multiply;
}

@keyframes dayNightCycle {

    0% {
        background:
            rgba(0,0,0,0);
    }

    25% {
        background:
            rgba(0,0,0,0);
    }

    50% {
        background:
            rgba(10,15,55,0.48);
    }

    75% {
        background:
            rgba(10,15,55,0.20);
    }

    100% {
        background:
            rgba(0,0,0,0);
    }
}


/* ==================================================
   CHMURY
================================================== */

.cloud {
    position: absolute;

    z-index: 10;

    width: 180px;
    height: 55px;

    background:
        rgba(255,255,255,0.55);

    border-radius: 50px;

    filter: blur(1px);

    opacity: 0.75;

    pointer-events: none;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    background:
        rgba(255,255,255,0.55);

    border-radius: 50%;
}

.cloud::before {
    width: 75px;
    height: 75px;

    left: 28px;
    top: -35px;
}

.cloud::after {
    width: 95px;
    height: 95px;

    right: 25px;
    top: -48px;
}

#cloud1 {
    top: 12%;
    left: -220px;

    transform: scale(0.9);

    animation:
        cloudMove1 75s linear infinite;
}

#cloud2 {
    top: 25%;
    left: -300px;

    transform: scale(0.65);

    opacity: 0.5;

    animation:
        cloudMove2 105s linear infinite;
}

#cloud3 {
    top: 8%;
    left: -400px;

    transform: scale(0.45);

    opacity: 0.4;

    animation:
        cloudMove3 130s linear infinite;
}

@keyframes cloudMove1 {

    from {
        transform:
            translateX(0)
            scale(0.9);
    }

    to {
        transform:
            translateX(calc(100vw + 500px))
            scale(0.9);
    }
}

@keyframes cloudMove2 {

    from {
        transform:
            translateX(0)
            scale(0.65);
    }

    to {
        transform:
            translateX(calc(100vw + 600px))
            scale(0.65);
    }
}

@keyframes cloudMove3 {

    from {
        transform:
            translateX(0)
            scale(0.45);
    }

    to {
        transform:
            translateX(calc(100vw + 700px))
            scale(0.45);
    }
}


/* ==================================================
   ŻYCIA
================================================== */

#lives {

    position: fixed;

    top: 18px;
    right: 22px;

    z-index: 200;

    padding: 9px 15px;

    border-radius: 14px;

    background:
        rgba(0,0,0,0.55);

    border:
        1px solid
        rgba(255,255,255,0.18);

    color: white;

    font-size: 24px;

    letter-spacing: 3px;

    pointer-events: none;

    text-shadow:
        0 0 8px
        rgba(255,0,0,0.45);
}


/* ==================================================
   HOTSPOTY
================================================== */

.location {

    position: absolute;

    width: 80px;
    height: 80px;

    transform:
        translate(-50%, -50%);

    border: none;

    padding: 0;
    margin: 0;

    background: transparent;

    cursor: pointer;

    z-index: 30;

    border-radius: 50%;

    outline: none;

    appearance: none;
}


/* ==================================================
   DOMEK
================================================== */

#house {

    left: 240px;
    top: 670px;

    width: 80px;
    height: 80px;

    transform:
        translate(
            49px,
            -58px
        );
}


/* ==================================================
   LAS
================================================== */

#forest {

    left: 35.45%;
    top: 45.08%;
}


/* ==================================================
   JEZIORO
================================================== */

#lake {

    left: 54.85%;
    top: 44.54%;

    display: none;
}


/* ==================================================
   ZAMEK
================================================== */

#castle {

    left: 72.727%;
    top: 44.541%;

    width: 5.985%;
    height: 9.622%;

    transform:
        translate(0,0);

    border-radius: 0;

    clip-path: polygon(
        0% 9.091%,
        93.151% 0%,
        100% 98.966%,
        6.757% 100%
    );

    display: none;
}


/* ==================================================
   JASKINIA
================================================== */

#cave {

    left: 86.82%;
    top: 22.81%;

    display: none;
}


/* ==================================================
   EKRAN DOMKU
================================================== */

#house-screen {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background: black;

    z-index: 400;

    color: white;

    text-align: center;

    padding: 30px;
}

#house-text {

    width:
        min(800px,90vw);

    font-size: 28px;

    line-height: 1.7;

    text-shadow:
        0 0 15px
        rgba(255,255,255,0.25);

    min-height: 120px;
}

#house-back {

    margin-top: 30px;

    padding: 12px 25px;

    border:
        2px solid white;

    border-radius: 10px;

    background: white;

    color: black;

    font-size: 17px;

    cursor: pointer;

    transition: 0.15s;
}

#house-back:hover {

    background: black;

    color: white;
}


/* ==================================================
   EKRAN ZAGADKI
================================================== */

#puzzle-screen {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,0.82);

    z-index: 100;
}


/* ==================================================
   PUDEŁKO
================================================== */

#puzzle-box {

    width:
        min(680px,92vw);

    max-height:
        90vh;

    overflow-y:
        auto;

    padding:
        40px;

    border-radius:
        24px;

    background:
        #171717;

    color:
        white;

    text-align:
        center;

    box-shadow:
        0 0 40px
        rgba(0,0,0,0.8);

    border:
        1px solid
        rgba(255,255,255,0.12);
}

#puzzle-box h1 {

    margin-top: 0;

    font-size: 36px;
}

#puzzle-box p {

    font-size: 18px;

    line-height: 1.6;
}


/* ==================================================
   POLE ODPOWIEDZI
================================================== */

#answer {

    width: 220px;

    padding: 12px;

    margin-top: 10px;

    border:
        2px solid white;

    border-radius: 8px;

    font-size: 18px;

    text-align: center;

    outline: none;
}


/* ==================================================
   PRZYCISKI
================================================== */

.puzzle-button {

    margin:
        15px 5px 0;

    padding:
        12px 22px;

    border:
        2px solid white;

    border-radius:
        10px;

    font-size:
        16px;

    cursor:
        pointer;

    background:
        white;

    color:
        black;

    transition:
        transform 0.15s ease,
        background 0.15s ease,
        color 0.15s ease;
}

.puzzle-button:hover {

    transform:
        translateY(-2px);

    background:
        black;

    color:
        white;
}


/* ==================================================
   JEZIORO — ODPOWIEDZI
================================================== */

.lake-option {

    display:
        block;

    width:
        260px;

    margin:
        12px auto;

    padding:
        14px 20px;

    border:
        2px solid white;

    border-radius:
        12px;

    background:
        white;

    color:
        black;

    font-size:
        18px;

    cursor:
        pointer;
}

.lake-option:hover {

    background:
        black;

    color:
        white;
}


/* ==================================================
   ZAMEK — LICZBY ZESPOLONE
================================================== */

.complex-puzzle {

    margin:
        25px auto;

    padding:
        20px;

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius:
        16px;

    background:
        #202020;
}

.complex-equation {

    font-size:
        21px;

    line-height:
        1.8;

    margin:
        10px 0 18px;
}

.complex-answer-row {

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        8px;
}

.complex-input {

    width:
        90px;

    padding:
        12px 8px;

    border:
        2px solid white;

    border-radius:
        8px;

    font-size:
        20px;

    text-align:
        center;

    outline:
        none;
}

.complex-dot {

    font-size:
        28px;

    font-weight:
        bold;

    color:
        white;
}


/* ==================================================
   PODPOWIEDZI
================================================== */

#hint-box {

    display:
        none;

    margin-top:
        20px;

    padding:
        18px;

    border-radius:
        14px;

    background:
        #222;

    border:
        1px solid
        rgba(255,255,255,0.2);

    font-size:
        17px;

    line-height:
        1.6;
}

#hint-question {

    display:
        none;

    margin-top:
        18px;

    font-size:
        17px;

    line-height:
        1.5;
}

#hint-yes,
#hint-no {

    display:
        none;

    margin:
        10px 4px 0;

    padding:
        9px 18px;

    border:
        2px solid white;

    border-radius:
        9px;

    cursor:
        pointer;

    font-size:
        15px;

    background:
        white;

    color:
        black;
}

#hint-yes:hover,
#hint-no:hover {

    background:
        black;

    color:
        white;
}


/* ==================================================
   WIADOMOŚĆ
================================================== */

#message {

    min-height:
        28px;

    margin-top:
        18px;

    font-size:
        18px;
}


/* ==================================================
   GAME OVER
================================================== */

#game-over {

    position:
        fixed;

    inset:
        0;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    flex-direction:
        column;

    background:
        black;

    z-index:
        1000;

    color:
        white;

    text-align:
        center;

    padding:
        30px;
}

#game-over h1 {

    font-size:
        42px;

    margin:
        0 0 20px;
}

#game-over p {

    font-size:
        20px;

    line-height:
        1.6;
}


/* ==================================================
   JASKINIA
================================================== */

#cave-screen {

    position:
        fixed;

    inset:
        0;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    background:
        black;

    z-index:
        500;

    color:
        white;

    text-align:
        center;

    padding:
        30px;
}

#cave-text {

    width:
        min(800px,90vw);

    font-size:
        24px;

    line-height:
        1.8;

    white-space:
        pre-line;

    min-height:
        200px;

    text-shadow:
        0 0 12px
        rgba(255,255,255,0.25);
}

</style>

</head>


<body>


<!-- ==================================================
     ŻYCIA
================================================== -->

<div id="lives">
    ❤️ ❤️ ❤️
</div>


<!-- ==================================================
     GRA
================================================== -->

<div id="game">

    <div id="world">

        <img
            id="game-map"
            src="Storybook-World-Map.png"
            alt="Mapa gry"
        >

        <div
            id="cloud1"
            class="cloud">
        </div>

        <div
            id="cloud2"
            class="cloud">
        </div>

        <div
            id="cloud3"
            class="cloud">
        </div>

        <div id="day-night"></div>


        <!-- DOMEK -->

        <button
            id="house"
            class="location"
            onclick="openHouse()">
        </button>


        <!-- LAS -->

        <button
            id="forest"
            class="location"
            onclick="openForest()">
        </button>


        <!-- JEZIORO -->

        <button
            id="lake"
            class="location"
            onclick="openLake()">
        </button>


        <!-- ZAMEK -->

        <button
            id="castle"
            class="location"
            onclick="openCastle()">
        </button>


        <!-- JASKINIA -->

        <button
            id="cave"
            class="location"
            onclick="openCave()">
        </button>

    </div>

</div>


<!-- ==================================================
     EKRAN DOMKU
================================================== -->

<div id="house-screen">

    <div id="house-text"></div>

    <button
        id="house-back"
        onclick="closeHouse()">

        Wróć na mapę

    </button>

</div>


<!-- ==================================================
     OKNO ZAGADKI
================================================== -->

<div id="puzzle-screen">

    <div id="puzzle-box">

        <h1 id="puzzle-title"></h1>

        <p id="puzzle-description"></p>

        <div id="puzzle-question"></div>

        <p id="puzzle-instruction"></p>

        <input
            id="answer"
            type="text"
            inputmode="numeric"
            autocomplete="off"
        >

        <br>

        <button
            id="check-button"
            class="puzzle-button">

            Sprawdź

        </button>

        <button
            id="hint-button"
            class="puzzle-button"
            onclick="showHint()">

            💭 „Coś mi to przypomina…”

        </button>

        <button
            class="puzzle-button"
            onclick="closePuzzle()">

            Wróć

        </button>

        <div id="hint-box"></div>

        <div id="hint-question">

            <span id="hint-question-text"></span>

            <br>

            <button
                id="hint-yes"
                onclick="answerHintYes()">

                Tak

            </button>

            <button
                id="hint-no"
                onclick="hideHintQuestion()">

                Nie

            </button>

        </div>

        <div id="message"></div>

    </div>

</div>


<!-- ==================================================
     GAME OVER
================================================== -->

<div id="game-over">

    <h1>
        💔 Koniec gry
    </h1>

    <p>
        Straciłeś wszystkie swoje życia.<br>
        Odśwież stronę i spróbuj ponownie.
    </p>

</div>


<!-- ==================================================
     JASKINIA
================================================== -->

<div id="cave-screen">

    <div id="cave-text"></div>

</div>


<script>

/* ==================================================
   STAN GRY
================================================== */

let lives = 3;

let lakeUnlocked = false;
let castleUnlocked = false;
let caveUnlocked = false;

let currentLocation = "";

let hintStage = 0;


/* ==================================================
   ŻYCIA
================================================== */

function updateLives() {

    const livesElement =
        document.getElementById("lives");

    let hearts = "";

    for (
        let i = 0;
        i < lives;
        i++
    ) {

        hearts += "❤️ ";

    }

    livesElement.textContent =
        hearts.trim();

}


function loseLife() {

    lives--;

    updateLives();

    if (lives <= 0) {

        gameOver();

    }

}


function gameOver() {

    document
        .getElementById("puzzle-screen")
        .style.display =
        "none";

    document
        .getElementById("house-screen")
        .style.display =
        "none";

    document
        .getElementById("cave-screen")
        .style.display =
        "none";

    document
        .getElementById("game")
        .style.display =
        "none";

    document
        .getElementById("lives")
        .style.display =
        "none";

    document
        .getElementById("game-over")
        .style.display =
        "flex";

}


/* ==================================================
   MAPA PODĄŻA ZA MYSZKĄ
================================================== */

document.addEventListener(
    "mousemove",
    function(event) {

        const x =
            (event.clientX /
            window.innerWidth) - 0.5;

        const y =
            (event.clientY /
            window.innerHeight) - 0.5;

        const moveX =
            x * 28;

        const moveY =
            y * 22;

        document
            .getElementById("world")
            .style.transform =
            `translate3d(
                ${moveX}px,
                ${moveY}px,
                0
            )`;

    }
);


/* ==================================================
   AUTOMATYCZNE FORMATOWANIE LICZB
================================================== */

document
    .getElementById("answer")
    .addEventListener(
        "input",
        function() {

            let value =
                this.value
                .replace(/\D/g, "");

            this.value =
                value.replace(
                    /\B(?=(\d{3})+(?!\d))/g,
                    " "
                );

        }
    );


/* ==================================================
   DOMEK
================================================== */

function openHouse() {

    document
        .getElementById("game")
        .style.display =
        "none";

    document
        .getElementById("house-screen")
        .style.display =
        "flex";

    const text =
`Witaj.

Twoja przygoda właśnie się zaczyna.

Idź do lasu.
Tam rozpoczniesz swoją przygodę...`;

    typeHouseText(text);

}


function closeHouse() {

    document
        .getElementById("house-screen")
        .style.display =
        "none";

    document
        .getElementById("game")
        .style.display =
        "block";

}


function typeHouseText(text) {

    const element =
        document
            .getElementById("house-text");

    element.textContent =
        "";

    let index =
        0;

    function writeNext() {

        if (
            index >=
            text.length
        ) {

            return;

        }

        element.textContent +=
            text[index];

        index++;

        let delay =
            45;

        if (
            text[index - 1] === "."
            ||
            text[index - 1] === "!"
            ||
            text[index - 1] === "?"
        ) {

            delay =
                500;

        }

        if (
            text[index - 1] === "\n"
        ) {

            delay =
                700;

        }

        setTimeout(
            writeNext,
            delay
        );

    }

    writeNext();

}


/* ==================================================
   RESET ZAGADKI
================================================== */

function resetPuzzle() {

    hintStage = 0;

    document
        .getElementById("hint-box")
        .style.display =
        "none";

    document
        .getElementById("hint-box")
        .textContent =
        "";

    hideHintQuestion();

    document
        .getElementById("message")
        .textContent =
        "";

    document
        .getElementById("answer")
        .value =
        "";

    document
        .querySelectorAll(".lake-option")
        .forEach(
            element =>
                element.remove()
        );

}


/* ==================================================
   LAS
================================================== */

function openForest() {

    currentLocation =
        "forest";

    resetPuzzle();

    document
        .getElementById("puzzle-title")
        .textContent =
        "🌲 Las";

    document
        .getElementById("puzzle-description")
        .textContent =
        "W lesie znajdujesz dziwną tabliczkę.";

    document
        .getElementById("puzzle-question")
        .innerHTML =
        `
        <strong>
            46 368 &nbsp;&nbsp;
            10 946 &nbsp;&nbsp;
            121 393 &nbsp;&nbsp;
            28 657 &nbsp;&nbsp;
            75 025 &nbsp;&nbsp;
            17 711
        </strong>
        `;

    document
        .getElementById("puzzle-instruction")
        .textContent =
        "Jaka liczba powinna pojawić się jako następna?";

    document
        .getElementById("answer")
        .style.display =
        "inline-block";

    document
        .getElementById("answer")
        .placeholder =
        "Wpisz liczbę";

    document
        .getElementById("check-button")
        .style.display =
        "inline-block";

    document
        .getElementById("check-button")
        .onclick =
        checkForestAnswer;

    document
        .getElementById("hint-button")
        .style.display =
        "inline-block";

    document
        .getElementById("puzzle-screen")
        .style.display =
        "flex";

}


function checkForestAnswer() {

    const answer =
        document
            .getElementById("answer")
            .value
            .replace(/\s/g,"");

    if (
        answer ===
        "196418"
    ) {

        lakeUnlocked =
            true;

        document
            .getElementById("lake")
            .style.display =
            "block";

        document
            .getElementById("message")
            .textContent =
            "✓ Poprawnie! Ścieżka prowadzi dalej...";

        setTimeout(
            closePuzzle,
            700
        );

    }

    else {

        document
            .getElementById("message")
            .textContent =
            "✗ Błędna odpowiedź. Straciłeś jedno życie.";

        document
            .getElementById("answer")
            .value =
            "";

        loseLife();

    }

}


/* ==================================================
   JEZIORO
================================================== */

function openLake() {

    currentLocation =
        "lake";

    resetPuzzle();

    document
        .getElementById("puzzle-title")
        .textContent =
        "🌊 Jezioro";

    document
        .getElementById("puzzle-description")
        .textContent =
        "Przy jeziorze znajduje się most. Musisz znaleźć właściwy podział.";

    document
        .getElementById("puzzle-question")
        .innerHTML =
        "<strong>Most ma 1309 jednostek.</strong>";

    document
        .getElementById("puzzle-instruction")
        .textContent =
        "Wybierz właściwy podział:";

    document
        .getElementById("answer")
        .style.display =
        "none";

    document
        .getElementById("check-button")
        .style.display =
        "none";

    document
        .getElementById("hint-button")
        .style.display =
        "inline-block";

    createLakeOptions();

    document
        .getElementById("puzzle-screen")
        .style.display =
        "flex";

}


function createLakeOptions() {

    const question =
        document
            .getElementById("puzzle-question");

    [
        "700 + 609",
        "800 + 509",
        "809 + 500",
        "900 + 409"

    ].forEach(
        function(option) {

            const button =
                document.createElement("button");

            button.className =
                "lake-option";

            button.textContent =
                option;

            button.onclick =
                function() {

                    checkLakeAnswer(option);

                };

            question
                .insertAdjacentElement(
                    "afterend",
                    button
                );

        }
    );

}

================================================== */

function openCave() {

    if (!caveUnlocked)
        return;

    document
        .getElementById("puzzle-screen")
        .style.display =
        "none";

    document
        .getElementById("game")
        .style.display =
        "none";

    document
        .getElementById("lives")
        .style.display =
        "none";

    const caveScreen =
        document
            .getElementById("cave-screen");

    caveScreen.style.display =
        "flex";

    const finalText =
`Tutaj pojawi się tekst finałowy.

Wymyślimy go razem.`;

    typeCaveText(finalText);

}


function typeCaveText(text) {

    const element =
        document
            .getElementById("cave-text");

    element.textContent =
        "";

    let index =
        0;

    function writeNext() {

        if (
            index >=
            text.length
        ) {

            return;

        }

        element.textContent +=
            text[index];

        index++;

        let delay =
            45;

        if (
            text[index - 1] === "."
            ||
            text[index - 1] === "!"
            ||
            text[index - 1] === "?"
        ) {

            delay =
                500;

        }

        if (
            text[index - 1] === "\n"
        ) {

            delay =
                700;

        }

        setTimeout(
            writeNext,
            delay
        );

    }

    writeNext();

}
