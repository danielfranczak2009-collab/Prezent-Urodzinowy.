<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nasza Gra</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#game {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: black;
}

#world {
    position: absolute;
    left: -4vw;
    top: -4vh;
    width: 108vw;
    height: 108vh;

    transform: translate3d(0, 0, 0);

    transition:
        transform 0.15s ease-out;

    will-change: transform;
}

#game-map {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;
    display: block;

    user-select: none;
    pointer-events: none;
}


/* ==================================================
   ŻYCIA
================================================== */

#lives {
    position: fixed;

    top: 20px;
    right: 25px;

    z-index: 60;

    font-size: 32px;

    letter-spacing: 5px;

    padding:
        8px 14px;

    border-radius:
        14px;

    background:
        #171717;

    border:
        2px solid
        rgba(255,255,255,0.25);

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.7);

    text-shadow:
        0 0 8px
        rgba(0,0,0,0.8);

    pointer-events:
        none;

    user-select:
        none;
}


/* ==================================================
   EKRAN KOŃCA GRY
================================================== */

#game-over {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background:
        #000000;

    color:
        white;

    z-index:
        1000;

    text-align:
        center;

    padding:
        30px;
}

#game-over h1 {

    font-size:
        52px;

    margin:
        0 0 20px;

}

#game-over p {

    font-size:
        21px;

    margin:
        0;

    opacity:
        0.85;

    line-height:
        1.6;

}

.game-over-heart {

    font-size:
        60px;

    margin-bottom:
        20px;

}


/* ==================================================
   CYKL DNIA I NOCY
================================================== */

#day-night {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 20;

    background:
        rgba(0, 0, 0, 0);

    animation:
        dayNightCycle 60s linear infinite;

    mix-blend-mode: multiply;
}

@keyframes dayNightCycle {

    0% {
        background:
            rgba(0,0,0,0);
    }

    25% {
        background:
            rgba(0,0,0,0);
    }

    50% {
        background:
            rgba(10,15,55,0.48);
    }

    75% {
        background:
            rgba(10,15,55,0.20);
    }

    100% {
        background:
            rgba(0,0,0,0);
    }
}


/* ==================================================
   CHMURY
================================================== */

.cloud {
    position: absolute;

    z-index: 10;

    width: 180px;
    height: 55px;

    background:
        rgba(255,255,255,0.55);

    border-radius: 50px;

    filter: blur(1px);

    opacity: 0.75;

    pointer-events: none;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    background:
        rgba(255,255,255,0.55);

    border-radius: 50%;
}

.cloud::before {
    width: 75px;
    height: 75px;

    left: 28px;
    top: -35px;
}

.cloud::after {
    width: 95px;
    height: 95px;

    right: 25px;
    top: -48px;
}

#cloud1 {
    top: 12%;
    left: -220px;

    transform: scale(0.9);

    animation:
        cloudMove1 75s linear infinite;
}

#cloud2 {
    top: 25%;
    left: -300px;

    transform: scale(0.65);

    opacity: 0.5;

    animation:
        cloudMove2 105s linear infinite;
}

#cloud3 {
    top: 8%;
    left: -400px;

    transform: scale(0.45);

    opacity: 0.4;

    animation:
        cloudMove3 130s linear infinite;
}

@keyframes cloudMove1 {

    from {
        transform:
            translateX(0)
            scale(0.9);
    }

    to {
        transform:
            translateX(calc(100vw + 500px))
            scale(0.9);
    }
}

@keyframes cloudMove2 {

    from {
        transform:
            translateX(0)
            scale(0.65);
    }

    to {
        transform:
            translateX(calc(100vw + 600px))
            scale(0.65);
    }
}

@keyframes cloudMove3 {

    from {
        transform:
            translateX(0)
            scale(0.45);
    }

    to {
        transform:
            translateX(calc(100vw + 700px))
            scale(0.45);
    }
}


/* ==================================================
   HOTSPOTY
================================================== */

.location {
    position: absolute;

    width: 80px;
    height: 80px;

    transform:
        translate(-50%, -50%);

    border: none;
    padding: 0;
    margin: 0;

    background: transparent;

    cursor: pointer;

    z-index: 30;

    border-radius: 50%;

    outline: none;

    appearance: none;
}


/* ==================================================
   DOMEK
================================================== */

#house {

    left: 15.536%;
    top: 69.797%;

}


/* ==================================================
   LAS
================================================== */

#forest {

    left: 35.45%;
    top: 45.08%;

    display:
        none;
}


/* ==================================================
   JEZIORO
================================================== */

#lake {

    left: 54.85%;
    top: 44.54%;

    display:
        none;
}


/* ==================================================
   ZAMEK
================================================== */

#castle {

    left: 72.727%;
    top: 44.541%;

    width: 5.985%;
    height: 9.622%;

    transform:
        translate(0,0);

    border-radius: 0;

    clip-path: polygon(
        0% 9.091%,
        93.151% 0%,
        100% 98.966%,
        6.757% 100%
    );

    display:
        none;
}


/* ==================================================
   JASKINIA
================================================== */

#cave {

    left: 86.82%;
    top: 22.81%;

    display:
        none;
}


/* ==================================================
   EKRAN ZAGADKI
================================================== */

#puzzle-screen {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,0.82);

    z-index: 100;
}


/* ==================================================
   PUDEŁKO
================================================== */

#puzzle-box {

    width:
        min(680px,92vw);

    max-height:
        90vh;

    overflow-y:
        auto;

    padding:
        40px;

    border-radius:
        24px;

    background:
        #171717;

    color:
        white;

    text-align:
        center;

    box-shadow:
        0 0 40px rgba(0,0,0,0.8);

    border:
        1px solid
        rgba(255,255,255,0.12);
}

#puzzle-box h1 {

    margin-top:
        0;

    font-size:
        36px;
}

#puzzle-box p {

    font-size:
        18px;

    line-height:
        1.6;
}


/* ==================================================
   POLE ODPOWIEDZI
================================================== */

#answer {

    width:
        220px;

    padding:
        12px;

    margin-top:
        10px;

    border:
        2px solid white;

    border-radius:
        8px;

    font-size:
        18px;

    text-align:
        center;

    outline:
        none;
}


/* ==================================================
   PRZYCISKI
================================================== */

.puzzle-button {

    margin:
        15px 5px 0;

    padding:
        12px 22px;

    border:
        2px solid white;

    border-radius:
        10px;

    font-size:
        16px;

    cursor:
        pointer;

    background:
        white;

    color:
        black;

    transition:
        transform 0.15s ease,
        background 0.15s ease,
        color 0.15s ease;
}

.puzzle-button:hover {

    transform:
        translateY(-2px);

    background:
        black;

    color:
        white;
}


/* ==================================================
   JEZIORO
================================================== */

.lake-option {

    display:
        block;

    width:
        260px;

    margin:
        12px auto;

    padding:
        14px 20px;

    border:
        2px solid white;

    border-radius:
        12px;

    background:
        white;

    color:
        black;

    font-size:
        18px;

    cursor:
        pointer;
}

.lake-option:hover {

    background:
        black;

    color:
        white;
}


/* ==================================================
   ZAMEK
================================================== */

.complex-puzzle {

    margin:
        25px auto;

    padding:
        20px;

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius:
        16px;

    background:
        #202020;
}

.complex-equation {

    font-size:
        21px;

    line-height:
        1.8;

    margin:
        10px 0 18px;
}

.complex-answer-row {

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        8px;
}

.complex-input {

    width:
        90px;

    padding:
        12px 8px;

    border:
        2px solid white;

    border-radius:
        8px;

    font-size:
        20px;

    text-align:
        center;

    outline:
        none;
}

.complex-dot {

    font-size:
        28px;

    font-weight:
        bold;

    color:
        white;
}


/* ==================================================
   PODPOWIEDZI
================================================== */

#hint-box {

    display:
        none;

    margin-top:
        20px;

    padding:
        18px;

    border-radius:
        14px;

    background:
        #222;

    border:
        1px solid
        rgba(255,255,255,0.2);

    font-size:
        17px;

    line-height:
        1.6;
}

#hint-question {

    display:
        none;

    margin-top:
        18px;

    font-size:
        17px;

    line-height:
        1.5;
}

#hint-yes,
#hint-no {

    display:
        none;

    margin:
        10px 4px 0;

    padding:
        9px 18px;

    border:
        2px solid white;

    border-radius:
        9px;

    cursor:
        pointer;

    font-size:
        15px;

    background:
        white;

    color:
        black;
}

#hint-yes:hover,
#hint-no:hover {

    background:
        black;

    color:
        white;
}


/* ==================================================
   WIADOMOŚĆ
================================================== */

#message {

    min-height:
        28px;

    margin-top:
        18px;

    font-size:
        18px;
}


/* ==================================================
   JASKINIA — FINAŁ
================================================== */

#cave-screen {

    position:
        fixed;

    inset:
        0;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    flex-direction:
        column;

    background:
        black;

    z-index:
        500;

    color:
        white;

    text-align:
        center;

    padding:
        30px;
}


/* ==================================================
   NAPIS KONIEC
================================================== */

#cave-ending {

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    width:
        100%;

    height:
        100%;
}

#cave-ending h1 {

    font-size:
        clamp(50px,8vw,100px);

    font-weight:
        300;

    letter-spacing:
        12px;

    margin:
        0 0 45px;

    text-shadow:
        0 0 25px
        rgba(255,255,255,0.25);
}


/* ==================================================
   PRZYCISK WIADOMOŚCI
================================================== */

#message-button {

    padding:
        15px 28px;

    border:
        2px solid white;

    border-radius:
        12px;

    background:
        white;

    color:
        black;

    font-size:
        18px;

    cursor:
        pointer;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
}

#message-button:hover {

    transform:
        translateY(-3px);

    background:
        black;

    color:
        white;
}


/* ==================================================
   TEKST FINAŁOWY
================================================== */

#final-message {

    display:
        none;

    width:
        min(850px,90vw);

    max-height:
        85vh;

    overflow-y:
        auto;

    font-size:
        22px;

    line-height:
        1.9;

    text-align:
        left;

    white-space:
        pre-line;

    padding:
        20px;

    text-shadow:
        0 0 12px
        rgba(255,255,255,0.20);
}

</style>

</head>


<body>


<div id="game">

    <div id="world">

        <img
            id="game-map"
            src="Storybook-World-Map.png"
            alt="Mapa gry"
        >

        <div
            id="cloud1"
            class="cloud">
        </div>

        <div
            id="cloud2"
            class="cloud">
        </div>

        <div
            id="cloud3"
            class="cloud">
        </div>

        <div id="day-night"></div>


        <!-- DOMEK -->

        <button
            id="house"
            class="location"
            onclick="openHouse()">
        </button>


        <!-- LAS -->

        <button
            id="forest"
            class="location"
            onclick="openForest()">
        </button>


        <!-- JEZIORO -->

        <button
            id="lake"
            class="location"
            onclick="openLake()">
        </button>


        <!-- ZAMEK -->

        <button
            id="castle"
            class="location"
            onclick="openCastle()">
        </button>


        <!-- JASKINIA -->

        <button
            id="cave"
            class="location"
            onclick="openCave()">
        </button>

    </div>

</div>


<!-- ==================================================
     ŻYCIA
================================================== -->

<div id="lives">
    ❤️ ❤️
</div>


<!-- ==================================================
     EKRAN KOŃCA GRY
================================================== -->

<div id="game-over">

    <div class="game-over-heart">
        💔
    </div>

    <h1>
        Koniec gry
    </h1>

    <p>
        Straciłeś wszystkie życia.<br>
        Odśwież stronę, aby spróbować ponownie.
    </p>

</div>


<!-- ==================================================
     OKNO ZAGADKI
================================================== -->

<div id="puzzle-screen">

    <div id="puzzle-box">

        <h1 id="puzzle-title"></h1>

        <p id="puzzle-description"></p>

        <div id="puzzle-question"></div>

        <p id="puzzle-instruction"></p>

        <input
            id="answer"
            type="text"
            inputmode="numeric"
            autocomplete="off"
        >

        <br>

        <button
            id="check-button"
            class="puzzle-button">
            Sprawdź
        </button>

        <button
            id="hint-button"
            class="puzzle-button"
            onclick="showHint()">
            💭 „Coś mi to przypomina…”
        </button>

        <button
            class="puzzle-button"
            onclick="closePuzzle()">
            Wróć
        </button>

        <div id="hint-box"></div>

        <div id="hint-question">

            <span id="hint-question-text"></span>

            <br>

            <button
                id="hint-yes"
                onclick="answerHintYes()">
                Tak
            </button>

            <button
                id="hint-no"
                onclick="hideHintQuestion()">
                Nie
            </button>

        </div>

        <div id="message"></div>

    </div>

</div>


<!-- ==================================================
     JASKINIA / FINAŁ
================================================== -->

<div id="cave-screen">

    <div id="cave-ending">

        <h1>
            KONIEC
        </h1>

        <button
            id="message-button"
            onclick="showFinalMessage()">
            Wiadomość ode mnie…
        </button>

    </div>

    <div id="final-message"></div>

</div>



<script>


/* ==================================================
   STAN GRY
================================================== */

let lives = 2;

let houseVisited = false;

let lakeUnlocked = false;
let castleUnlocked = false;
let caveUnlocked = false;

let currentLocation = "";

let hintStage = 0;


/* ==================================================
   AKTUALIZACJA ŻYCIA
================================================== */

function updateLives() {

    const livesElement =
        document.getElementById("lives");

    if (lives === 2) {

        livesElement.textContent =
            "❤️ ❤️";

    }

    else if (lives === 1) {

        livesElement.textContent =
            "❤️ ♡";

    }

    else {

        livesElement.textContent =
            "♡ ♡";
    }
}


/* ==================================================
   UTRATA ŻYCIA
================================================== */

function loseLife() {

    lives--;

    updateLives();

    if (lives <= 0) {

        document
            .getElementById("puzzle-screen")
            .style.display =
            "none";

        document
            .getElementById("game")
            .style.display =
            "none";

        document
            .getElementById("lives")
            .style.display =
            "none";

        document
            .getElementById("game-over")
            .style.display =
            "flex";

        return true;
    }

    return false;
}


/* ==================================================
   DOMEK
================================================== */

function openHouse() {

    currentLocation =
        "house";

    houseVisited =
        true;

    document
        .getElementById("forest")
        .style.display =
        "block";

    resetPuzzle();

    document
        .getElementById("puzzle-title")
        .textContent =
        "🏠 Domek";

    document
        .getElementById("puzzle-description")
        .textContent =
        "";

    document
        .getElementById("puzzle-question")
        .innerHTML =
        `
        <div style="
            min-height:220px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:26px;
            line-height:1.6;
        ">
            Idź do lasu,<br>
            tam zacznie się Twoja przygoda. 🌲
        </div>
        `;

    document
        .getElementById("puzzle-instruction")
        .textContent =
        "";

    document
        .getElementById("answer")
        .style.display =
        "none";

    document
        .getElementById("check-button")
        .style.display =
        "none";

    document
        .getElementById("hint-button")
        .style.display =
        "none";

    document
        .getElementById("puzzle-screen")
        .style.display =
        "flex";
}


/* ==================================================
   MAPA PODĄŻA ZA MYSZKĄ
================================================== */

document.addEventListener(
    "mousemove",
    function(event) {

        const x =
            (event.clientX /
            window.innerWidth) - 0.5;

        const y =
            (event.clientY /
            window.innerHeight) - 0.5;

        const moveX =
            x * 28;

        const moveY =
            y * 22;

        document
            .getElementById("world")
            .style.transform =
            `translate3d(
                ${moveX}px,
                ${moveY}px,
                0
            )`;
    }
);


/* ==================================================
   AUTOMATYCZNE FORMATOWANIE LICZB
================================================== */

document
    .getElementById("answer")
    .addEventListener(
        "input",
        function() {

            let value =
                this.value
                .replace(/\D/g, "");

            this.value =
                value.replace(
                    /\B(?=(\d{3})+(?!\d))/g,
                    " "
                );

        }
    );


/* ==================================================
   RESET ZAGADKI
================================================== */

function resetPuzzle() {

    hintStage = 0;

    document
        .getElementById("hint-box")
        .style.display =
        "none";

    document
        .getElementById("hint-box")
        .textContent =
        "";

    hideHintQuestion();

    document
        .getElementById("message")
        .textContent =
        "";

    document
        .getElementById("answer")
        .value =
        "";

    document
        .querySelectorAll(".lake-option")
        .forEach(
            element =>
                element.remove()
        );
}


/* ==================================================
   LAS
================================================== */

function openForest() {

    if (!houseVisited) {
        return;
    }

    currentLocation =
        "forest";

    resetPuzzle();

    document
        .getElementById("puzzle-title")
        .textContent =
        "🌲 Las";

    document
        .getElementById("puzzle-description")
        .textContent =
        "W lesie znajdujesz dziwną tabliczkę.";

    document
        .getElementById("puzzle-question")
        .innerHTML =
        `
        <strong>
            46 368 &nbsp;&nbsp;
            10 946 &nbsp;&nbsp;
            121 393 &nbsp;&nbsp;
            28 657 &nbsp;&nbsp;
            75 025 &nbsp;&nbsp;
            17 711
        </strong>
        `;

    document
        .getElementById("puzzle-instruction")
        .textContent =
        "Jaka liczba powinna pojawić się jako następna?";

    document
        .getElementById("answer")
        .style.display =
        "inline-block";

    document
        .getElementById("answer")
        .placeholder =
        "Wpisz liczbę";

    document
        .getElementById("check-button")
        .style.display =
        "inline-block";

    document
        .getElementById("check-button")
        .onclick =
        checkForestAnswer;

    document
        .getElementById("hint-button")
        .style.display =
        "inline-block";

    document
        .getElementById("puzzle-screen")
        .style.display =
        "flex";
}


/* ==================================================
   LAS — SPRAWDZANIE
================================================== */

function checkForestAnswer() {

    const answer =
        document
            .getElementById("answer")
            .value
            .replace(/\s/g,"");

    if (
        answer ===
        "196418"
    ) {

        lakeUnlocked =
            true;

        document
            .getElementById("lake")
            .style.display =
            "block";

        document
            .getElementById("message")
            .textContent =
            "✓ Poprawnie! Ścieżka prowadzi dalej...";

        setTimeout(
            closePuzzle,
            700
        );

    }

    else {

        if (loseLife()) {
            return;
        }

        document
            .getElementById("message")
            .textContent =
            "✗ Zła odpowiedź. Straciłeś życie.";

    }
}


/* ==================================================
   JEZIORO
================================================== */

function openLake() {

    currentLocation =
        "lake";

    resetPuzzle();

    document
        .getElementById("puzzle-title")
        .textContent =
        "🌊 Jezioro";

    document
        .getElementById("puzzle-description")
        .textContent =
        "Przy jeziorze znajduje się most. Musisz znaleźć właściwy podział.";

    document
        .getElementById("puzzle-question")
        .innerHTML =
        "<strong>Most ma 1309 jednostek.</strong>";

    document
        .getElementById("puzzle-instruction")
        .textContent =
        "Wybierz właściwy podział:";

    document
        .getElementById("answer")
        .style.display =
        "none";

    document

function createLakeOptions() {

    const question =
        document
            .getElementById("puzzle-question");

    [
        "700 + 609",
        "800 + 509",
        "809 + 500",
        "900 + 409"

    ].forEach(
        function(option) {

            const button =
                document.createElement("button");

            button.className =
                "lake-option";

            button.textContent =
                option;

            button.onclick =
                function() {

                    checkLakeAnswer(
                        option
                    );

                };

            question
                .insertAdjacentElement(
                    "afterend",
                    button
                );

        }
    );
}

/* ==================================================
   POWOLNE PISANIE WIADOMOŚCI
================================================== */

function typeFinalText(text) {

    const element =
        document
            .getElementById("final-message");

    element.textContent =
        "";

    let index =
        0;

    function writeNext() {

        if (
            index >=
            text.length
        ) {
            return;
        }

        element.textContent +=
            text[index];

        index++;

        let delay =
            38;

        if (
            text[index - 1] === "."
            ||
            text[index - 1] === "!"
            ||
            text[index - 1] === "?"
        ) {

            delay =
                450;
        }

        if (
            text[index - 1] === "\n"
        ) {

            delay =
                800;
        }

        setTimeout(
            writeNext,
            delay
        );
    }

    writeNext();
}
