<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nasza Gra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* CAŁA GRA */
        #game {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* MAPA */
        #game-map {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            display: block;
        }

        /* PRZYCISK LASU */
        #forest-button {
            position: absolute;

            left: 25%;
            top: 35%;

            width: 120px;
            height: 120px;

            border: 3px solid white;
            border-radius: 50%;

            background: rgba(0, 0, 0, 0.25);

            color: white;
            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        #forest-button:hover {
            transform: scale(1.08);
            background: rgba(255,255,255,0.2);
        }

        /* EKRAN ZAGADKI */
        #puzzle-screen {
            display: none;

            position: absolute;
            inset: 0;

            background: rgba(0,0,0,0.85);

            color: white;

            align-items: center;
            justify-content: center;

            z-index: 10;
        }

        #puzzle-box {
            width: min(600px, 85%);

            padding: 35px;

            border-radius: 20px;

            background: #151515;

            text-align: center;

            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        input {
            padding: 12px;

            font-size: 18px;

            width: 180px;

            text-align: center;

            margin-top: 15px;
        }

        #puzzle-box button {
            padding: 12px 20px;

            font-size: 16px;

            cursor: pointer;

            margin: 10px;
        }

        #message {
            min-height: 25px;

            margin-top: 15px;
        }
    </style>
</head>

<body>

<div id="game">

    <!-- MAPA -->
    <img
        id="game-map"
        src="Storybook-World-Map.png"
        alt="Mapa gry"
    >

    <!-- LAS -->
    <button id="forest-button" onclick="openForest()">
        🌲 LAS
    </button>

    <!-- ZAGADKA LASU -->
    <div id="puzzle-screen">

        <div id="puzzle-box">

            <h1>🌲 Las</h1>

            <p>
                W lesie znajdujesz dziwną tabliczkę.
            </p>

            <p>
                <strong>1, 1, 2, 3, 5, 8, ?, ?</strong>
            </p>

            <p>
                Uzupełnij dwie kolejne liczby.
            </p>

            <input
                id="answer"
                type="text"
                placeholder="13, 21"
            >

            <br>

            <button onclick="checkAnswer()">
                Sprawdź
            </button>

            <button onclick="closePuzzle()">
                Wróć
            </button>

            <div id="message"></div>

        </div>

    </div>

</div>

<script>

function openForest() {
    document.getElementById("puzzle-screen").style.display = "flex";
}

function closePuzzle() {
    document.getElementById("puzzle-screen").style.display = "none";
    document.getElementById("message").textContent = "";
}

function checkAnswer() {

    const answer = document
        .getElementById("answer")
        .value
        .replace(/\s/g, "");

    if (answer === "13,21") {

        document.getElementById("message").textContent =
            "✓ Poprawnie! Ścieżka prowadzi dalej...";

    } else {

        document.getElementById("message").textContent =
            "✗ To nie jest właściwa odpowiedź. Spróbuj jeszcze raz.";

    }

}

</script>

</body>
</html>
