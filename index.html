<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nasza Gra</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }


        /* =========================
           GRA
        ========================= */

        #game {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #000;
        }


        /* =========================
           ŚWIAT MAPY
        ========================= */

        #world {
            position: absolute;

            left: -4vw;
            top: -4vh;

            width: 108vw;
            height: 108vh;

            transform: translate3d(0, 0, 0);

            transition: transform 0.15s ease-out;

            will-change: transform;
        }


        /* =========================
           MAPA
        ========================= */

        #game-map {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            object-fit: fill;

            display: block;

            user-select: none;

            pointer-events: none;
        }


        /* =========================
           CYKL DNIA I NOCY
        ========================= */

        #day-night {
            position: absolute;

            inset: 0;

            pointer-events: none;

            z-index: 20;

            background: rgba(0, 0, 0, 0);

            animation: dayNightCycle 60s linear infinite;

            mix-blend-mode: multiply;
        }


        @keyframes dayNightCycle {

            0% {
                background: rgba(0, 0, 0, 0);
            }

            25% {
                background: rgba(0, 0, 0, 0);
            }

            50% {
                background: rgba(10, 15, 55, 0.48);
            }

            75% {
                background: rgba(10, 15, 55, 0.20);
            }

            100% {
                background: rgba(0, 0, 0, 0);
            }
        }


        /* =========================
           CHMURY
        ========================= */

        .cloud {

            position: absolute;

            z-index: 10;

            width: 180px;
            height: 55px;

            background: rgba(255, 255, 255, 0.55);

            border-radius: 50px;

            filter: blur(1px);

            opacity: 0.75;

            pointer-events: none;
        }


        .cloud::before,
        .cloud::after {

            content: "";

            position: absolute;

            background: rgba(255, 255, 255, 0.55);

            border-radius: 50%;
        }


        .cloud::before {

            width: 75px;
            height: 75px;

            left: 28px;
            top: -35px;
        }


        .cloud::after {

            width: 95px;
            height: 95px;

            right: 25px;
            top: -48px;
        }


        #cloud1 {

            top: 12%;

            left: -220px;

            transform: scale(0.9);

            animation:
                cloudMove1 75s linear infinite;
        }


        #cloud2 {

            top: 25%;

            left: -300px;

            transform: scale(0.65);

            opacity: 0.5;

            animation:
                cloudMove2 105s linear infinite;
        }


        #cloud3 {

            top: 8%;

            left: -400px;

            transform: scale(0.45);

            opacity: 0.4;

            animation:
                cloudMove3 130s linear infinite;
        }


        @keyframes cloudMove1 {

            from {
                transform: translateX(0) scale(0.9);
            }

            to {
                transform:
                    translateX(calc(100vw + 500px))
                    scale(0.9);
            }
        }


        @keyframes cloudMove2 {

            from {
                transform: translateX(0) scale(0.65);
            }

            to {
                transform:
                    translateX(calc(100vw + 600px))
                    scale(0.65);
            }
        }


        @keyframes cloudMove3 {

            from {
                transform: translateX(0) scale(0.45);
            }

            to {
                transform:
                    translateX(calc(100vw + 700px))
                    scale(0.45);
            }
        }


        /* =========================
           HOTSPOTY
        ========================= */

        .location {

            position: absolute;

            width: 80px;
            height: 80px;

            transform: translate(-50%, -50%);

            border: none;

            padding: 0;
            margin: 0;

            background: transparent;

            cursor: pointer;

            z-index: 30;

            border-radius: 50%;

            outline: none;

            appearance: none;
        }


        #forest {
            left: 35.45%;
            top: 45.08%;
        }


        #lake {
            left: 54.85%;
            top: 44.54%;

            display: none;
        }


        #castle {

            left: 72.727%;
            top: 44.541%;

            width: 5.985%;
            height: 9.622%;

            transform: translate(0, 0);

            border-radius: 0;

            clip-path: polygon(
                0% 9.091%,
                93.151% 0%,
                100% 98.966%,
                6.757% 100%
            );
        }


        #cave {
            left: 86.82%;
            top: 22.81%;
        }


        /* =========================
           EKRAN ZAGADKI
        ========================= */

        #puzzle-screen {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.82);

            z-index: 100;
        }


        /* =========================
           PUDEŁKO
        ========================= */

        #puzzle-box {

            width: min(650px, 90vw);

            max-height: 90vh;

            overflow-y: auto;

            padding: 40px;

            border-radius: 24px;

            background: #171717;

            color: white;

            text-align: center;

            box-shadow:
                0 0 40px rgba(0, 0, 0, 0.8);

            border: 1px solid rgba(255, 255, 255, 0.12);
        }


        #puzzle-box h1 {

            margin-top: 0;

            font-size: 36px;
        }


        #puzzle-box p {

            font-size: 18px;

            line-height: 1.6;
        }


        /* =========================
           ODPOWIEDŹ
        ========================= */

        #answer {

            width: 220px;

            padding: 12px;

            margin-top: 10px;

            border: 2px solid white;

            border-radius: 8px;

            font-size: 18px;

            text-align: center;

            outline: none;
        }


        /* =========================
           PRZYCISKI
        ========================= */

        .puzzle-button {

            margin: 15px 5px 0;

            padding: 12px 22px;

            border: 2px solid white;

            border-radius: 10px;

            font-size: 16px;

            cursor: pointer;

            background: white;

            color: black;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                color 0.15s ease;
        }


        .puzzle-button:hover {

            transform: translateY(-2px);

            background: black;

            color: white;
        }


        /* =========================
           PODPOWIEDŹ
        ========================= */

        #hint-button {
            display: inline-block;
        }


        #hint-box {

            display: none;

            margin-top: 20px;

            padding: 18px;

            border-radius: 14px;

            background: #222;

            border: 1px solid rgba(255, 255, 255, 0.2);

            font-size: 17px;

            line-height: 1.6;
        }


        #hint-question {

            display: none;

            margin-top: 18px;

            font-size: 17px;

            line-height: 1.5;
        }


        #hint-yes,
        #hint-no {

            display: none;

            margin: 10px 4px 0;

            padding: 9px 18px;

            border: 2px solid white;

            border-radius: 9px;

            cursor: pointer;

            font-size: 15px;

            background: white;

            color: black;
        }


        #hint-yes:hover,
        #hint-no:hover {

            background: black;

            color: white;
        }


        /* =========================
           WIADOMOŚĆ
        ========================= */

        #message {

            min-height: 28px;

            margin-top: 18px;

            font-size: 18px;
        }

    </style>

</head>


<body>


<div id="game">


    <div id="world">


        <!-- MAPA -->

        <img
            id="game-map"
            src="Storybook-World-Map.png"
            alt="Mapa gry"
        >


        <!-- CHMURY -->

        <div id="cloud1" class="cloud"></div>
        <div id="cloud2" class="cloud"></div>
        <div id="cloud3" class="cloud"></div>


        <!-- CYKL DNIA I NOCY -->

        <div id="day-night"></div>


        <!-- =========================
             FOREST
        ========================= -->

        <button
            id="forest"
            class="location"
            onclick="openForest()"
            aria-label="Forest"
        ></button>


        <!-- =========================
             LAKE + BRIDGE
        ========================= -->

        <button
            id="lake"
            class="location"
            onclick="openLocation('Lake + Bridge')"
            aria-label="Lake + Bridge"
        ></button>


        <!-- =========================
             CASTLE
        ========================= -->

        <button
            id="castle"
            class="location"
            onclick="openLocation('Castle')"
            aria-label="Castle"
        ></button>


        <!-- =========================
             CAVE
        ========================= -->

        <button
            id="cave"
            class="location"
            onclick="openLocation('Cave')"
            aria-label="Cave"
        ></button>


    </div>

</div>



<!-- =========================
     EKRAN ZAGADKI
========================= -->

<div id="puzzle-screen">


    <div id="puzzle-box">


        <h1 id="puzzle-title">
            🌲 Las
        </h1>


        <p id="puzzle-description">
            W lesie znajdujesz dziwną tabliczkę.
        </p>


        <p id="puzzle-question">

            <strong>
                46 368 &nbsp;&nbsp;
                10 946 &nbsp;&nbsp;
                121 393 &nbsp;&nbsp;
                28 657 &nbsp;&nbsp;
                75 025 &nbsp;&nbsp;
                17 711
            </strong>

        </p>


        <p id="puzzle-instruction">
            Jaka liczba powinna pojawić się jako następna?
        </p>


        <input
            id="answer"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Wpisz liczbę"
        >


        <br>


        <button
            id="check-button"
            class="puzzle-button"
            onclick="checkAnswer()"
        >
            Sprawdź
        </button>


        <button
            id="hint-button"
            class="puzzle-button"
            onclick="showHint()"
        >
            💭 „Coś mi to przypomina…”
        </button>


        <button
            class="puzzle-button"
            onclick="closePuzzle()"
        >
            Wróć
        </button>


        <div id="hint-box"></div>


        <div id="hint-question">

            Chcesz drugą podpowiedź?

            <br>

            <button
                id="hint-yes"
                onclick="showSecondHint()"
            >
                Tak
            </button>

            <button
                id="hint-no"
                onclick="hideHintQuestion()"
            >
                Nie
            </button>

        </div>


        <div id="message"></div>


    </div>

</div>



<script>


    /* =========================
       STAN GRY
    ========================= */

    let lakeUnlocked = false;

    let hintStage = 0;



    /* =========================
       RUCH MAPY ZA MYSZKĄ
    ========================= */

    document.addEventListener("mousemove", function(event) {

        const x =
            (event.clientX / window.innerWidth) - 0.5;

        const y =
            (event.clientY / window.innerHeight) - 0.5;


        const moveX = x * 28;
        const moveY = y * 22;


        document
            .getElementById("world")
            .style.transform =
            `translate3d(${moveX}px, ${moveY}px, 0)`;

    });



    /* =========================
       FORMATOWANIE LICZBY
       196418 → 196 418
    ========================= */

    document
        .getElementById("answer")
        .addEventListener("input", function() {

            let value =
                this.value.replace(/\D/g, "");


            value =
                value.replace(
                    /\B(?=(\d{3})+(?!\d))/g,
                    " "
                );


            this.value = value;

        });



    /* =========================
       FOREST
    ========================= */

    function openForest() {

        hintStage = 0;


        document
            .getElementById("puzzle-title")
            .textContent = "🌲 Las";


        document
            .getElementById("puzzle-description")
            .textContent =
            "W lesie znajdujesz dziwną tabliczkę.";


        document
            .getElementById("puzzle-question")
            .innerHTML =
            "<strong>" +
            "46 368 &nbsp;&nbsp; " +
            "10 946 &nbsp;&nbsp; " +
            "121 393 &nbsp;&nbsp; " +
            "28 657 &nbsp;&nbsp; " +
            "75 025 &nbsp;&nbsp; " +
            "17 711" +
            "</strong>";


        document
            .getElementById("puzzle-instruction")
            .textContent =
            "Jaka liczba powinna pojawić się jako następna?";


        document
            .getElementById("answer")
            .value = "";


        document
            .getElementById("answer")
            .placeholder =
            "Wpisz liczbę";


        document
            .getElementById("answer")
            .style.display =
            "inline-block";


        document
            .getElementById("check-button")
            .style.display =
            "inline-block";


        document
            .getElementById("hint-button")
            .style.display =
            "inline-block";


        document
            .getElementById("hint-box")
            .style.display =
            "none";


        document
            .getElementById("hint-box")
            .textContent = "";


        document
            .getElementById("hint-question")
            .style.display =
            "none";


        document
            .getElementById("hint-yes")
            .style.display =
            "none";


        document
            .getElementById("hint-no")
            .style.display =
            "none";


        document
            .getElementById("message")
            .textContent = "";


        document
            .getElementById("puzzle-screen")
            .style.display =
            "flex";

    }



    /* =========================
       PODPOWIEDZI
    ========================= */

    function showHint() {

        const hintBox =
            document.getElementById("hint-box");

        const hintQuestion =
            document.getElementById("hint-question");

        const hintYes =
            document.getElementById("hint-yes");

        const hintNo =
            document.getElementById("hint-no");


        if (hintStage === 0) {

            hintStage = 1;


            hintBox.textContent =
                "„Kiedyś powiedziałeś mi, że najlepiej wszystko sobie po kolei ułożyć, zanim ruszysz na głęboką wodę.”";


            hintBox.style.display =
                "block";


            return;
        }


        if (hintStage === 1) {

            hintStage = 2;


            hintQuestion.style.display =
                "block";


            hintYes.style.display =
                "inline-block";


            hintNo.style.display =
                "inline-block";

        }

    }



    /* =========================
       DRUGA PODPOWIEDŹ
    ========================= */

    function showSecondHint() {

        document
            .getElementById("hint-question")
            .style.display =
            "none";


        document
            .getElementById("hint-yes")
            .style.display =
            "none";


        document
            .getElementById("hint-no")
            .style.display =
            "none";


        document
            .getElementById("hint-box")
            .textContent =
            "Zacznij od najmniejszej liczby i ułóż wszystkie liczby od najmniejszej do największej.";


        document
            .getElementById("hint-box")
            .style.display =
            "block";


        hintStage = 3;

    }



    /* =========================
       TRZECIA PODPOWIEDŹ
    ========================= */

    function showThirdHint() {

        document
            .getElementById("hint-box")
            .textContent =
            "Fibonacci";


        document
            .getElementById("hint-box")
            .style.display =
            "block";


        hintStage = 4;

    }



    /* =========================
       DODATKOWY KLIK PO DRUGIEJ
       → TRZECIA PODPOWIEDŹ
    ========================= */

    document
        .getElementById("hint-button")
        .addEventListener("dblclick", function() {

            if (hintStage >= 3) {

                showThirdHint();

            }

        });



    /* =========================
       NIE
    ========================= */

    function hideHintQuestion() {

        document
            .getElementById("hint-question")
            .style.display =
            "none";


        document
            .getElementById("hint-yes")
            .style.display =
            "none";


        document
            .getElementById("hint-no")
            .style.display =
            "none";

    }



    /* =========================
       POZOSTAŁE LOKACJE
    ========================= */

    function openLocation(name) {

        document
            .getElementById("puzzle-title")
            .textContent = name;


        document
            .getElementById("puzzle-description")
            .textContent =
            "Ta lokacja jest jeszcze zamknięta.";


        document
            .getElementById("puzzle-question")
            .innerHTML =
            "Wkrótce znajdzie się tutaj zagadka.";


        document
            .getElementById("puzzle-instruction")
            .textContent = "";


        document
            .getElementById("answer")
            .style.display =
            "none";


        document
            .getElementById("check-button")
            .style.display =
            "none";


        document
            .getElementById("hint-button")
            .style.display =
            "none";


        document
            .getElementById("hint-box")
            .style.display =
            "none";


        document
            .getElementById("hint-question")
            .style.display =
            "none";


        document
            .getElementById("hint-yes")
            .style.display =
            "none";


        document
            .getElementById("hint-no")
            .style.display =
            "none";


        document
            .getElementById("message")
            .textContent = "";


        document
            .getElementById("puzzle-screen")
            .style.display =
            "flex";

    }



    /* =========================
       ZAMYKANIE
    ========================= */

    function closePuzzle() {

        document
            .getElementById("puzzle-screen")
            .style.display =
            "none";


        document
            .getElementById("message")
            .textContent = "";


        document
            .getElementById("answer")
            .value = "";


        document
            .getElementById("hint-box")
            .style.display =
            "none";


        document
            .getElementById("hint-question")
            .style.display =
            "none";


        document
            .getElementById("hint-yes")
            .style.display =
            "none";


        document
            .getElementById("hint-no")
            .style.display =
            "none";


        hintStage = 0;

    }



    /* =========================
       SPRAWDZANIE ODPOWIEDZI
    ========================= */

    function checkAnswer() {

        const answer =
            document
                .getElementById("answer")
                .value
                .replace(/\s/g, "");


        if (answer === "196418") {

            lakeUnlocked = true;


            document
                .getElementById("lake")
                .style.display =
                "block";


            document
                .getElementById("message")
                .textContent =
                "✓ Poprawnie! Ścieżka prowadzi dalej...";


            setTimeout(function() {

                closePuzzle();

            }, 900);

        }

        else {

            document
                .getElementById("message")
                .textContent =
                "✗ Spróbuj jeszcze raz.";

        }

    }


</script>


</body>
</html>
