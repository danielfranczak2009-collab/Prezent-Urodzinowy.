<!DOCTYPE html>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#game {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: black;
}

#world {
    position: absolute;
    left: -4vw;
    top: -4vh;
    width: 108vw;
    height: 108vh;

    transform: translate3d(0,0,0);

    transition:
        transform 0.15s ease-out;

    will-change: transform;
}

#game-map {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    display: block;

    user-select: none;
    pointer-events: none;
}


/* ==================================================
   CYKL DNIA I NOCY
================================================== */

#day-night {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 20;

    background:
        rgba(0,0,0,0);

    animation:
        dayNightCycle 60s linear infinite;

    mix-blend-mode: multiply;
}

@keyframes dayNightCycle {

    0% {
        background:
            rgba(0,0,0,0);
    }

    25% {
        background:
            rgba(0,0,0,0);
    }

    50% {
        background:
            rgba(10,15,55,0.48);
    }

    75% {
        background:
            rgba(10,15,55,0.20);
    }

    100% {
        background:
            rgba(0,0,0,0);
    }
}


/* ==================================================
   CHMURY
================================================== */

.cloud {
    position: absolute;

    z-index: 10;

    width: 180px;
    height: 55px;

    background:
        rgba(255,255,255,0.55);

    border-radius: 50px;

    filter: blur(1px);

    opacity: 0.75;

    pointer-events: none;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    background:
        rgba(255,255,255,0.55);

    border-radius: 50%;
}

.cloud::before {
    width: 75px;
    height: 75px;

    left: 28px;
    top: -35px;
}

.cloud::after {
    width: 95px;
    height: 95px;

    right: 25px;
    top: -48px;
}

#cloud1 {
    top: 12%;
    left: -220px;

    transform: scale(0.9);

    animation:
        cloudMove1 75s linear infinite;
}

#cloud2 {
    top: 25%;
    left: -300px;

    transform: scale(0.65);

    opacity: 0.5;

    animation:
        cloudMove2 105s linear infinite;
}

#cloud3 {
    top: 8%;
    left: -400px;

    transform: scale(0.45);

    opacity: 0.4;

    animation:
        cloudMove3 130s linear infinite;
}

@keyframes cloudMove1 {

    from {
        transform:
            translateX(0)
            scale(0.9);
    }

    to {
        transform:
            translateX(calc(100vw + 500px))
            scale(0.9);
    }
}

@keyframes cloudMove2 {

    from {
        transform:
            translateX(0)
            scale(0.65);
    }

    to {
        transform:
            translateX(calc(100vw + 600px))
            scale(0.65);
    }
}

@keyframes cloudMove3 {

    from {
        transform:
            translateX(0)
            scale(0.45);
    }

    to {
        transform:
            translateX(calc(100vw + 700px))
            scale(0.45);
    }
}


/* ==================================================
   SERCA
================================================== */

#lives {

    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 200;

<script>


/* ==================================================
   MUZYKA — CYKL DNIA I NOCY
================================================== */

const dayMusic =
    document.getElementById("dayMusic");

const nightMusic =
    document.getElementById("nightMusic");


dayMusic.volume = 0;
nightMusic.volume = 0;


let musicStarted = false;


/*
   CAŁY CYKL = 100 SEKUND

   0–40 s   = DZIEŃ
   40–50 s  = FADE DZIEŃ → NOC
   50–90 s  = NOC
   90–100 s = FADE NOC → DZIEŃ

   Fade trwa dokładnie 10 sekund.
*/

const MUSIC_CYCLE = 100000;

const MUSIC_VOLUME = 0.05;


function startMusic() {

    if (musicStarted)
        return;

    musicStarted = true;

    dayMusic
        .play()
        .catch(() => {});

    nightMusic
        .play()
        .catch(() => {});

    updateMusic();
}


function updateMusic() {

    const time =
        (Date.now() % MUSIC_CYCLE)
        / MUSIC_CYCLE;


    let dayVolume = 0;
    let nightVolume = 0;


    /*
       0–40 SEKUND
       CZYSTY DZIEŃ
    */

    if (time < 0.4) {

        dayVolume =
            MUSIC_VOLUME;

        nightVolume =
            0;

    }


    /*
       40–50 SEKUND
       FADE DZIEŃ → NOC

       Pierwsze 5 sekund:
       dzień całkowicie cichnie.

       Drugie 5 sekund:
       noc zaczyna grać.
    */

    else if (time < 0.5) {

        const progress =
            (time - 0.4) / 0.1;


        if (progress < 0.5) {

            dayVolume =
                MUSIC_VOLUME *
                (1 - progress * 2);

            nightVolume =
                0;

        }

        else {

            dayVolume =
                0;

            nightVolume =
                MUSIC_VOLUME *
                ((progress - 0.5) * 2);

        }

    }


    /*
       50–90 SEKUND
       CZYSTA NOC
    */

    else if (time < 0.9) {

        dayVolume =
            0;

        nightVolume =
            MUSIC_VOLUME;

    }


    /*
       90–100 SEKUND
       FADE NOC → DZIEŃ

       Pierwsze 5 sekund:
       noc całkowicie cichnie.

       Drugie 5 sekund:
       dzień zaczyna grać.
    */

    else {

        const progress =
            (time - 0.9) / 0.1;


        if (progress < 0.5) {

            dayVolume =
                0;

            nightVolume =
                MUSIC_VOLUME *
                (1 - progress * 2);

        }

        else {

            dayVolume =
                MUSIC_VOLUME *
                ((progress - 0.5) * 2);

            nightVolume =
                0;

        }

    }


    dayMusic.volume =
        Math.max(
            0,
            Math.min(
                1,
                dayVolume
            )
        );

    nightMusic.volume =
        Math.max(
            0,
            Math.min(
                1,
                nightVolume
            )
        );
}


/*
   Aktualizacja 10 razy na sekundę.
*/

setInterval(
    updateMusic,
    100
);


/*
   Pierwsze kliknięcie uruchamia muzykę.
*/

document.addEventListener(
    "click",
    startMusic,
    { once: true }
);


/* ==================================================
   STAN GRY
================================================== */

let lives = 2;

let lakeUnlocked = false;
let castleUnlocked = false;
let caveUnlocked = false;

let currentLocation = "";

let hintStage = 0;


/* ==================================================
   SERCA
================================================== */

function updateLives() {

    document
        .getElementById("heart1")
        .classList.toggle(
            "lost",
            lives < 1
        );

    document
        .getElementById("heart2")
        .classList.toggle(
            "lost",
            lives < 2

    function(event) {

        const x =
            (event.clientX /
            window.innerWidth) - 0.5;

        const y =
            (event.clientY /
            window.innerHeight) - 0.5;

        const moveX =
            x * 28;

        const moveY =
            y * 22;

        document
            .getElementById("world")
            .style.transform =
            `translate3d(

                ${moveY}px,

            )`;

);

function startFinalMessage() {

    document

        .style.display =
        "none";

    document
        .getElementById("message-screen")
        .style.display =
        "flex";

    playFinalLine(0);

/* ==================================================
   POJEDYNCZE WIERSZE
================================================== */

function playFinalLine(index) {

    const element =
        document
            .getElementById("message-line");

    if (
        index >= finalLines.length
    ) {

        setTimeout(
            showFinalScreen,
            1000
        );

        return;
    }


    element.classList.remove(
        "visible"
    );


    setTimeout(
        function() {

            element.textContent =
                finalLines[index];

            element.classList.add(
                "visible"
            );


            const length =
                finalLines[index].length;

            const readingTime =
                Math.max(
                    3200,
                    Math.min(
                        6500,
                        length * 70
                    )
                );


            setTimeout(
                function() {

                    element.classList.remove(
                        "visible"
                    );


                    setTimeout(
                        function() {

                            playFinalLine(
                                index + 1
                            );

                        },
                        1200
                    );

                },
                readingTime
            );

        },
        100
    );
}
