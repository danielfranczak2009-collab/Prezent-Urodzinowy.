<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasza Gra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #game {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* MAPA */
        #game-map {
            position: absolute;
            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            /*
             * Celowo rozciągamy obraz na cały ekran.
             * Dzięki temu NIE MA czarnych pasów.
             */
            object-fit: fill;

            display: block;
        }

        /* =========================
           LAS
        ========================= */

        #forest {
            position: absolute;

            /*
             * Tymczasowa pozycja.
             * Później ustawimy ją dokładnie na lesie.
             */
            left: 20%;
            top: 30%;

            width: 130px;
            height: 130px;

            border-radius: 50%;

            border: 3px solid white;

            background: rgba(0, 0, 0, 0.25);

            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            z-index: 5;

            transition: transform 0.2s, background 0.2s;
        }

        #forest:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.2);
        }

        /* =========================
           EKRAN ZAGADKI
        ========================= */

        #puzzle-screen {
            position: fixed;
            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.85);

            z-index: 100;
        }

        #puzzle-box {
            width: min(600px, 90vw);

            padding: 40px;

            border-radius: 24px;

            background: #171717;

            color: white;

            text-align: center;

            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        #puzzle-box h1 {
            margin-top: 0;
            font-size: 36px;
        }

        #puzzle-box p {
            font-size: 18px;
            line-height: 1.6;
        }

        /* ODPOWIEDŹ */

        #answer {
            width: 200px;

            padding: 12px;

            margin-top: 10px;

            border: none;
            border-radius: 8px;

            font-size: 18px;

            text-align: center;
        }

        /* PRZYCISKI */

        .puzzle-button {
            margin: 15px 5px 0;

            padding: 12px 22px;

            border: none;
            border-radius: 10px;

            font-size: 16px;

            cursor: pointer;
        }

        #message {
            min-height: 28px;
            margin-top: 18px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div id="game">

        <!-- MAPA -->
        <img
            id="game-map"
            src="Storybook-World-Map.png"
            alt="Mapa gry"
        >

        <!-- LAS -->
        <button
            id="forest"
            onclick="openForest()"
        >
            🌲 LAS
        </button>

    </div>


    <!-- =========================
         ZAGADKA LASU
    ========================== -->

    <div id="puzzle-screen">

        <div id="puzzle-box">

            <h1>🌲 Las</h1>

            <p>
                W lesie znajdujesz dziwną tabliczkę.
            </p>

            <p>
                <strong>1, 1, 2, 3, 5, 8, ?, ?</strong>
            </p>

            <p>
                Uzupełnij dwie kolejne liczby.
            </p>

            <input
                id="answer"
                type="text"
                placeholder="13, 21"
            >

            <br>

            <button
                class="puzzle-button"
                onclick="checkAnswer()"
            >
                Sprawdź
            </button>

            <button
                class="puzzle-button"
                onclick="closePuzzle()"
            >
                Wróć
            </button>

            <div id="message"></div>

        </div>

    </div>


    <script>

        /* OTWIERANIE LASU */

        function openForest() {

            document
                .getElementById("puzzle-screen")
                .style.display = "flex";

        }


        /* ZAMYKANIE */

        function closePuzzle() {

            document
                .getElementById("puzzle-screen")
                .style.display = "none";

            document
                .getElementById("message")
                .textContent = "";

            document
                .getElementById("answer")
                .value = "";

        }


        /* SPRAWDZANIE */

        function checkAnswer() {

            const answer = document
                .getElementById("answer")
                .value
                .replace(/\s/g, "");


            if (answer === "13,21") {

                document
                    .getElementById("message")
                    .textContent =
                    "✓ Poprawnie! Ścieżka prowadzi dalej...";

            } else {

                document
                    .getElementById("message")
                    .textContent =
                    "✗ Spróbuj jeszcze raz.";

            }

        }

    </script>

</body>
</html>
